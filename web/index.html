/* ============================================================
   ④ 卡片管理页（卡片-账户一体化）
   —— 卡片必须挂靠真实账户：卡是账户的入口，不是装饰记录。
      · 储蓄卡：默认开新账户（生成账号 + 合法卡号）或挂靠已有账户（单账户 ≤2 张）
      · 信用卡：挂信用账户（每人一个，共享额度 ¥5,000）—— 只展示不转账
      · 同一账户下的卡余额同步；卡片里的钱用「归集到主账户」搬到主账户花
   ============================================================ */
const CARD_KIND_LABEL = {
  debit_new:  '储蓄卡 · 开新账户',
  debit_link: '储蓄卡 · 挂靠已有账户',
  credit:     '信用卡 · 额度 ¥5,000',
};

function CardsPage() {
  /* A4：额度 click 级遮蔽（会话内点开一次即保持） */
  const [limitShown, setLimitShown] = useState(false);
  const [ver, setVer] = useState(0);
  const cs = useApi('/api/cards', [ver]);
  const as = useApi('/api/accounts', [ver]);
  const { phoneBound } = useUser();              // 写操作闸门：申请新卡前先查绑定态
  const cards = (cs.data && cs.data.cards) || [];
  const limits = (cs.data && cs.data.limits) || { debit: { used: 0, max: 3 }, credit: { used: 0, max: 2 } };
  const accounts = (as.data && as.data.accounts) || [];
  const debitAccounts = accounts.filter(a => (a.account_type || 'debit') !== 'credit');
  const mainAccount = debitAccounts.find(a => a.is_primary) || debitAccounts[0] || null;
  const debitFull = limits.debit.used >= limits.debit.max;
  const creditFull = limits.credit.used >= limits.credit.max;

  /* 申请新卡：卡类型三选一（开新账户 / 挂靠已有账户 / 信用卡） */
  const [kind, setKind] = useState('debit_new');
  const [linkAccId, setLinkAccId] = useState('');
  const [applyBusy, setApplyBusy] = useState(false);
  const [applyMsg, setApplyMsg] = useState(null);   // {ok: bool, text: string}
  const [newCard, setNewCard] = useState(null);     // 申请成功 → 完整卡号只展示一次
  const kindFull = (kind === 'credit') ? creditFull : debitFull;

  /* C9：直接冻结/解冻（与 AI 同管道，本人确认后执行） */
  const [directTask, setDirectTask] = useState(null);
  /* 归集弹层：金额 → 支付密码 → 完成（本人账户间划转，免验证码） */
  const [collect, setCollect] = useState(null);
  const [collectBusy, setCollectBusy] = useState(false);
  const [collectErr, setCollectErr] = useState('');
  const [collectNeedSet, setCollectNeedSet] = useState(false);

  const inputCls = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-sm text-slate-700 '
                 + 'outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition';

  const applyCard = async (e) => {
    e.preventDefault();
    if (!requireBind(phoneBound)) return;        // 申请新卡是写操作，未绑定先引导
    if (kindFull) return;
    const formEl = e.currentTarget;   // React 合成事件：await 后 e.currentTarget 会被置 null，先缓存
    const f = new FormData(formEl);
    const ctype = kind === 'credit' ? 'credit' : 'debit';
    const accountId = kind === 'debit_link' ? Number(linkAccId || 0) : null;
    if (kind === 'debit_link' && !accountId) {
      setApplyMsg({ ok: false, text: '请选择要挂靠的账户' });
      return;
    }
    setApplyBusy(true);
    setApplyMsg(null);
    setNewCard(null);
    try {
      const res = await fetch('/api/cards/apply', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          name: (String(f.get('name') || '').trim()) || null,
          type: ctype,
          account_id: accountId,
        }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || ('HTTP ' + res.status));
      formEl.reset();
      setNewCard(d);                             // ★ 完整卡号 4-4-4-4 只在这里展示一次
      setApplyMsg({ ok: true, text: d.message || '申请成功' });
      setVer(v => v + 1);
    } catch (err) {
      setApplyMsg({ ok: false, text: '申请失败：' + err.message });
    } finally {
      setApplyBusy(false);
    }
  };

  /* ---- 打开归集弹层：查支付密码状态（未设置 → 先设置；已锁定 → 直接提示） ---- */
  const openCollect = async (card) => {
    if (!requireBind(phoneBound)) return;
    if (!mainAccount) { setApplyMsg({ ok: false, text: '没有可用主账户，暂时无法归集' }); return; }
    const others = debitAccounts.filter(a => a.id !== card.account_id);
    setCollectErr('');
    setCollectBusy(false);
    setCollect({
      card,
      fromId: String(card.account_id || ''),
      toId: String((mainAccount && mainAccount.id) || (others[0] && others[0].id) || ''),
      amt: '',
      step: 'amount',
      result: null,
    });
    try {
      const res = await fetch('/api/pay/password/status', { headers: authHeaders() });
      const d = await res.json().catch(() => ({}));
      setCollectNeedSet(d && d.has_password === false);
      if (d && d.locked) setCollectErr('支付密码已锁定（连续错误 3 次），请明日再试');
    } catch (err) { setCollectNeedSet(false); }
  };

  const collectAmount = Number(collect && collect.amt || 0);

  const submitPwd = async (pwd) => {
    if (!collect) return;
    if (!(collectAmount > 0)) { setCollectErr('请输入正确的归集金额'); return; }
    setCollectBusy(true);
    setCollectErr('');
    try {
      const url = collectNeedSet ? '/api/pay/password/set' : '/api/pay/password/verify';
      let res = await fetch(url, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ password: pwd }),
      });
      let d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.message || '支付密码核验失败');
      res = await fetch('/api/accounts/transfer-internal', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          from_account_id: Number(collect.fromId),
          to_account_id: Number(collect.toId),
          amount: collectAmount,
        }),
      });
      d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || '归集失败');
      setCollect(c => ({ ...c, step: 'done', result: d }));
      setVer(v => v + 1);
    } catch (err) {
      setCollectErr(err.message);
    } finally {
      setCollectBusy(false);
    }
  };

  const fromAccount = collect
    ? (accounts.find(a => String(a.id) === String(collect.fromId)) || {}) : {};
  const toAccount = collect
    ? (accounts.find(a => String(a.id) === String(collect.toId)) || {}) : {};

  return (
    <PageShell className="space-y-5">
      <div className="grid grid-cols-3 gap-4">
        <StatCard label="持有卡片" value={cards.length} icon="credit-card" tone="blue" raw />
        <StatCard label="使用中" value={cards.filter(c => c.status === 'normal').length}
                  icon="check-circle" tone="emerald" raw />
        <StatCard label="已冻结" value={cards.filter(c => c.status !== 'normal').length}
                  icon="snowflake" tone="cyan" raw />
      </div>

      {/* 申请新卡：卡片挂靠真实账户（储蓄卡开新账户/挂靠已有账户；信用卡挂信用账户） */}
      <Panel title="申请新卡" icon="credit-card"
             right={<span className="text-[11px] text-slate-400">
               储蓄卡 {limits.debit.used}/{limits.debit.max} · 信用卡 {limits.credit.used}/{limits.credit.max}
             </span>}>
        <form onSubmit={applyCard} className="space-y-3">
          <div className="flex items-end gap-3">
            <label className="flex-1">
              <span className="block text-[11px] text-slate-400 mb-1">卡面名称（选填）</span>
              <input name="name" className={inputCls} placeholder="如：家庭共享卡 / 出差专用卡"
                     maxLength={20} />
            </label>
            <label className="w-56 shrink-0">
              <span className="block text-[11px] text-slate-400 mb-1">卡类型</span>
              <select value={kind} onChange={e => setKind(e.target.value)} className={inputCls}>
                <option value="debit_new">储蓄卡 · 开新账户</option>
                <option value="debit_link">储蓄卡 · 挂靠已有账户</option>
                <option value="credit">信用卡 · 额度 ¥5,000</option>
              </select>
            </label>
            <button type="submit" disabled={applyBusy || kindFull}
              className="shrink-0 inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2.5 text-xs font-medium
                         bg-brand-600 hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed text-ongold
                         shadow-[0_4px_14px_rgba(212,160,23,0.28)] transition-all active:scale-[0.98]">
              {applyBusy ? '申请中…' : (kindFull ? '已达上限' : '立即申请')}
            </button>
          </div>

          {/* 挂靠模式：下拉列出本人账户（同一账户最多 2 张卡；已满的置灰不可选） */}
          {kind === 'debit_link' && (
            <label className="block">
              <span className="block text-[11px] text-slate-400 mb-1">挂靠到哪个账户</span>
              <select value={linkAccId} onChange={e => setLinkAccId(e.target.value)} className={inputCls}>
                <option value="">请选择账户</option>
                {debitAccounts.map(a => (
                  <option key={a.id} value={a.id} disabled={!a.can_bind_more}>
                    {a.name}（尾号 {a.card_tail || '—'}）· 已挂 {a.card_count}/2 张卡
                  </option>
                ))}
              </select>
              <span className="block mt-1 text-[11px] text-slate-400">
                挂靠的卡与账户同余额：同一账户下的卡余额同步显示；卡可注销，账户余额不受影响。
              </span>
            </label>
          )}

          <div className="text-[11px] text-slate-400">
            {kind === 'credit'
              ? '信用卡挂信用账户（每人一个，共享额度 ¥5,000），卡号独立；信用卡功能演示中，仅展示额度与状态。'
              : '储蓄卡开出来的账户余额为 ¥0.00，卡号立即可用于收款（对方按卡号转账即可入账）。'}
          </div>

          {(kindFull || applyMsg) && (
            <div className="space-y-1">
              {kindFull && (
                <div className="text-xs text-amber-600">
                  已达{kind === 'credit' ? '信用卡' : '储蓄卡'}上限（
                  {kind === 'credit' ? limits.credit.used : limits.debit.used}/
                  {kind === 'credit' ? limits.credit.max : limits.debit.max} 张），
                  如需新卡请先注销不用的卡。
                </div>
              )}
              {applyMsg && (
                <div className={`text-xs ${applyMsg.ok ? 'text-emerald-600' : 'text-rose-500'}`}>
                  {applyMsg.text}
                </div>
              )}
            </div>
          )}
        </form>

        {/* 申请成功：完整卡号仅展示这一次（4-4-4-4），请妥善保管 */}
        {newCard && (
          <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50/60 px-4 py-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-medium text-emerald-700">
                「{newCard.card_name}」申请成功 · 请妥善保管卡号
              </span>
              <button onClick={() => setNewCard(null)}
                className="text-[11px] text-slate-400 hover:text-slate-600 transition-colors">我已保存</button>
            </div>
            <div className="mt-2 font-mono text-[22px] tracking-[0.18em] text-slate-800">
              {newCard.card_no_grouped}
            </div>
            <div className="mt-2 text-[11px] text-slate-500 leading-relaxed">
              完整卡号仅在本次展示，之后列表只显示尾号 {newCard.tail}。
              {newCard.card_type === 'credit'
                ? `已挂信用账户「${newCard.account_name}」，可用额度 ¥${fmtMoney(newCard.available_limit)}。`
                : `已关联账户「${newCard.account_name}」（余额 ¥${fmtMoney(newCard.account_balance)}），
                   对方按此卡号转账即可入账，到账用「归集到主账户」搬到主账户使用。`}
            </div>
          </div>
        )}
      </Panel>

      {cs.loading ? <Loading /> : cs.error ? <ErrBox text={cs.error} />
        : cards.length === 0 ? <Empty text="暂无银行卡" icon="credit-card" />
        : (
          <div className="grid grid-cols-2 gap-4">
            {cards.map(c => {
              const frozen = c.status !== 'normal';
              const isCredit = c.card_type === 'credit';
              const used = isCredit ? c.used_limit : 0;
              const limit = isCredit ? c.credit_limit : 0;
              const usage = isCredit ? Math.min(Math.max(c.usage_ratio, 0), 1) : 0;

              return (
                <div key={c.id}
                  className={`relative overflow-hidden rounded-2xl p-5 text-white transition-all duration-300
                    ${frozen ? 'grayscale opacity-75' : 'shadow-[0_8px_24px_rgba(0,0,0,0.45)]'}`}
                  style={{
                    backgroundImage: isCredit ? T.cardFaceCredit : T.cardFaceDebit,
                    border: isCredit ? '1px solid rgba(227,196,106,0.55)' : '1px solid rgba(0,229,199,0.45)',
                  }}>
                  {/* 装饰光斑 */}
                  <span className="pointer-events-none absolute -top-16 -right-10 w-44 h-44 rounded-full opacity-20 blur-2xl"
                        style={{ background: 'linear-gradient(135deg,#F0D590 0%,#FFFFFF 100%)' }} />
                  {/* 冻结角标 */}
                  {frozen && (
                    <span className="absolute top-3 right-3 inline-flex items-center gap-1 px-2 py-0.5 rounded-full
                                     bg-white/20 text-[10px] font-medium backdrop-blur-sm">
                      已冻结
                    </span>
                  )}

                  <div className="relative">
                    <div className="flex items-center justify-between mb-5">
                      <span className="text-[11px] text-white/60">{c.bank}</span>
                      <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium
                        ${frozen ? 'bg-orange-400/25 text-orange-100' : 'bg-emerald-400/25 text-emerald-100'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${frozen ? 'bg-orange-300' : 'bg-emerald-300'}`} />
                        {frozen ? '已冻结' : '使用中'}
                      </span>
                    </div>

                    <div className="text-base font-semibold tracking-wide mb-0.5">{c.card_name || c.bank}</div>
                    <div className="font-mono text-sm tracking-[0.18em] text-white/85">
                      •••• •••• •••• {c.tail || (c.card_no || '').slice(-4)}
                    </div>

                    {/* 关联账户：卡背后的账户名 + 余额（click 级遮蔽） */}
                    <div className="mt-3 mb-1 flex items-center justify-between text-[11px]">
                      <span className="text-white/70 truncate">
                        关联账户：{c.account_name || '未关联'}
                        {c.account_is_primary ? '（主账户）' : ''}
                      </span>
                      <span className="text-white/70 shrink-0 ml-2">
                        余额 <Amount value={c.account_balance} level="click" className="!text-white" />
                      </span>
                    </div>

                    {/* 信用卡额度进度条 */}
                    {isCredit ? (
                      <div className="mt-3 mb-1">
                        <div className="flex items-center justify-between text-[10px] text-white/70 mb-1.5">
                          <span>可用额度{' '}
                            {limitShown
                              ? <span className="font-mono amount-fade">¥{fmtMoney(c.available_limit)}</span>
                              : <button onClick={() => setLimitShown(true)}
                                  className="font-mono hover:text-white transition-colors">{MASK_TEXT}</button>}
                          </span>
                          <span className="font-mono">{(usage * 100).toFixed(0)}% 已用</span>
                        </div>
                        <div className="h-1.5 rounded-full bg-white/20 overflow-hidden">
                          <div className="h-full rounded-full transition-all duration-700"
                               style={{
                                 width: `${Math.max(usage * 100, 4)}%`,
                                 background: usage > 0.9
                                   ? 'linear-gradient(90deg,#FB7185 0%,#F43F5E 100%)'
                                   : 'linear-gradient(90deg,#F0D590 0%,#E3C46A 100%)',
                               }} />
                        </div>
                        <div className="text-[10px] text-white/50 mt-1.5 font-mono">
                          {limitShown ? <>总额度 ¥{fmtMoney(limit)} · 已用 ¥{fmtMoney(used)}</> : '点击可用额度数字查看明细'}
                        </div>
                        <div className="text-[10px] text-white/45 mt-1">信用卡功能演示中（仅展示额度与状态，不支持转账收款）</div>
                      </div>
                    ) : (
                      <div className="text-[10px] text-white/50 mt-2">
                        储蓄卡 · 卡号尾号 {c.tail} · 可用于收款
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}

      {/* 操作区：冻结/解冻走对话页预填确认；归集走本人账户间划转（支付密码核验） */}
      {!cs.loading && !cs.error && cards.length > 0 && (
        <Panel title="卡片操作" icon="shield-check"
               right={<span className="text-[11px] text-slate-400">冻结 / 解冻需经小微安全确认 · 归集仅需支付密码</span>}>
          <div className="space-y-2.5">
            {cards.map(c => {
              const frozen = c.status !== 'normal';
              const isCredit = c.card_type === 'credit';
              const onMain = mainAccount && String(c.account_id) === String(mainAccount.id);
              return (
                <div key={c.id} className="flex items-center gap-3 rounded-xl border border-slate-100 px-4 py-2.5
                                            hover:border-brand-200 transition-colors">
                  <span className="text-xs text-slate-700 flex-1 truncate">
                    {c.card_name || c.bank}
                    <span className="text-slate-400 font-mono ml-1.5">尾号 {c.tail || (c.card_no || '').slice(-4)}</span>
                    <span className="text-slate-400 ml-2">{c.account_name ? '账户 ' + c.account_name : ''}</span>
                  </span>
                  <AskBtn text={`我的${c.card_name || c.bank}（尾号${c.tail}）现在是什么状态`} compact />
                  {!isCredit && !onMain && (
                    <button onClick={() => openCollect(c)} disabled={frozen}
                      className="inline-flex items-center justify-center rounded-xl px-3 py-1.5 text-[11px] font-medium
                                 border border-brand-200 text-brand-700 hover:bg-brand-50
                                 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                      归集到主账户
                    </button>
                  )}
                  {!isCredit && onMain && (
                    <span className="text-[11px] text-slate-300 px-1">已挂靠主账户</span>
                  )}
                  {isCredit && <span className="text-[11px] text-slate-300 px-1">信用卡演示中</span>}
                  {/* C9：直接冻结/解冻（与 AI 同一条安全管道，本人确认后执行） */}
                  <button
                    onClick={() => setDirectTask({
                      title: frozen ? '直接解冻银行卡' : '直接冻结银行卡',
                      action: frozen ? 'unfreeze_card' : 'freeze_card',
                      params: { card_id: c.id },
                      confirmPrompt: `确认${frozen ? '解冻' : '冻结'}「${c.card_name || c.bank}（尾号 ${c.tail}）」？`
                        + (frozen ? '' : ' 冻结后该卡暂停支付，可随时解冻。'),
                    })}
                    className="px-2.5 py-1.5 rounded-lg text-[11px] font-medium border transition-colors"
                    style={{ color: frozen ? 'var(--chrome-safe, #2FD07A)' : '#E8C46A',
                             borderColor: frozen ? 'rgba(47,208,122,0.4)' : 'rgba(212,160,23,0.4)' }}>
                    {frozen ? '解冻' : '冻结'}
                  </button>
                  <ActionBtn text={frozen ? `解冻我的${c.card_name || c.bank}（尾号${c.tail}）`
                                          : `冻结我的${c.card_name || c.bank}（尾号${c.tail}）`}
                             tone="ghost" className="!py-1.5 !text-[11px]">
                    问小微
                  </ActionBtn>
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {/* 归集弹层：金额 → 支付密码 → 完成（本人账户间，免验证码） */}
      {collect && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center px-4"
             style={{ background: 'rgba(15,23,42,0.38)' }}
             onClick={() => { if (!collectBusy) setCollect(null); }}>
          <div className="w-full max-w-md" onClick={e => e.stopPropagation()}>
            {collect.step === 'amount' && (
              <div className="rounded-2xl bg-panel px-5 py-4 shadow-xl">
                <div className="flex items-center justify-between">
                  <span className="text-[14px] font-semibold text-slate-700">归集到主账户</span>
                  <span className="text-[11px] text-slate-400">本人账户间划转 · 免验证码</span>
                </div>
                <div className="mt-3 space-y-3">
                  <div className="rounded-xl bg-slate-50 px-3 py-2.5 text-[12px] text-slate-600 space-y-1">
                    <div>转出账户：{fromAccount.name || '—'}
                      <span className="text-slate-400 font-mono ml-1.5">{fromAccount.card_no_masked || ''}</span></div>
                    <div>账户余额：<Amount value={fromAccount.balance} level="click" /></div>
                  </div>
                  <label className="block">
                    <span className="block text-[11px] text-slate-400 mb-1">转入账户</span>
                    <select value={String(collect.toId)} className={inputCls}
                            onChange={e => setCollect(c => ({ ...c, toId: e.target.value }))}>
                      {debitAccounts.filter(a => String(a.id) !== String(collect.fromId)).map(a => (
                        <option key={a.id} value={a.id}>
                          {a.name}{a.is_primary ? '（主账户）' : ''} · 尾号 {a.card_tail || '—'}
                        </option>
                      ))}
                    </select>
                  </label>
                  <label className="block">
                    <span className="block text-[11px] text-slate-400 mb-1">归集金额</span>
                    <div className="flex items-center gap-2">
                      <input type="number" min="0" step="0.01" value={collect.amt} placeholder="0.00"
                             className={inputCls}
                             onChange={e => setCollect(c => ({ ...c, amt: e.target.value }))} />
                      <button type="button"
                        onClick={() => setCollect(c => ({ ...c, amt: String(fromAccount.balance || 0) }))}
                        className="shrink-0 rounded-xl border border-slate-200 px-3 py-2.5 text-[11px] text-slate-500
                                   hover:border-brand-200 hover:text-brand-600 transition-colors">全部</button>
                    </div>
                  </label>
                  <div className="text-[11px] text-slate-400 leading-relaxed">
                    归集后主账户余额增加、此卡归零；该卡仍可继续收款（收入只进不出，需归集后才能用于付款）。
                  </div>
                </div>
                <div className="mt-4 flex items-center justify-end gap-2">
                  <button onClick={() => setCollect(null)}
                    className="rounded-xl px-3 py-2 text-[12px] text-slate-400 hover:text-slate-600 transition-colors">
                    取消
                  </button>
                  <button
                    onClick={() => {
                      if (!(Number(collect.amt) > 0)) { setCollectErr('请输入正确的归集金额'); return; }
                      setCollectErr('');
                      setCollect(c => ({ ...c, step: 'pwd' }));
                    }}
                    className="rounded-xl bg-brand-600 hover:bg-brand-700 px-4 py-2 text-[12px] font-medium text-ongold
                               shadow-[0_4px_14px_rgba(212,160,23,0.28)] transition-all active:scale-[0.98]">
                    下一步
                  </button>
                </div>
                {collectErr && <div className="mt-2 text-[11px] text-rose-500">{collectErr}</div>}
              </div>
            )}

            {collect.step === 'pwd' && (
              <div className="space-y-2">
                <div className="rounded-xl bg-panel px-4 py-2.5 text-[12px] text-slate-600 shadow">
                  归集 {fromAccount.name} → {toAccount.name} · 金额 ¥{fmtMoney(collect.amt)}
                </div>
                <PasswordCard busy={collectBusy} errorText={collectErr} needSet={collectNeedSet}
                              onFilled={submitPwd}
                              onCancel={() => { setCollectErr(''); setCollect(c => ({ ...c, step: 'amount' })); }} />
              </div>
            )}

            {collect.step === 'done' && (
              <div className="rounded-2xl bg-panel px-5 py-5 shadow-xl">
                <div className="text-[14px] font-semibold text-emerald-700">归集完成</div>
                <div className="mt-2 text-[12px] text-slate-600 leading-relaxed">
                  {(collect.result && collect.result.message) || '资金归集已完成'}
                </div>
                <div className="mt-2 text-[11px] text-slate-400">
                  {toAccount.name} 余额 ¥{fmtMoney(collect.result && collect.result.to_balance_after)} ·
                  {' '}{fromAccount.name} 余额 ¥{fmtMoney(collect.result && collect.result.from_balance_after)}
                </div>
                <div className="mt-4 flex justify-end">
                  <button onClick={() => { setCollect(null); setCollectErr(''); }}
                    className="rounded-xl bg-brand-600 hover:bg-brand-700 px-4 py-2 text-[12px] font-medium text-ongold
                               transition-all active:scale-[0.98]">完成</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
      {directTask && (
        <DirectTaskModal title={directTask.title} action={directTask.action} params={directTask.params}
                         confirmPrompt={directTask.confirmPrompt}
                         onClose={() => setDirectTask(null)} onDone={() => setVer(v => v + 1)} />
      )}
    </PageShell>
  );
}

/* ============================================================
   ⑤ 订阅管理页（v2：签约代扣 + 流水识别 + 自动扣款）
   ============================================================ */
function SubsPage() {
  /* v2 语义：
     - 订阅只有两个来源：contracted=签约代扣（用户主动签约）、identified=流水识别；
     - 「签约代扣」表单替代旧"手动添加"—— 签约后到期由银行自动扣款；
     - 「新发现」区展示流水识别引擎挖出的疑似周期扣款，用户确认才转正；
     - 列表进入时后端已惰性执行到期扣款，看到的永远是扣完之后的最新状态。 */
  const [ver, setVer] = useState(0);
  const ss = useApi('/api/subscriptions', [ver]);
  const sd = useApi('/api/subscriptions/discover', [ver]);
  const { phoneBound } = useUser();              // 写操作闸门：签约/确认前先查绑定态
  const subs = (ss.data && ss.data.subscriptions) || [];
  const idle = ss.data ? ss.data.idle : { count: 0, monthly_waste: 0, items: [] };
  const candidates = (sd.data && sd.data.candidates) || [];
  const [busy, setBusy] = useState(null);        // 'contract' / 'confirm:商家' / 'ignore:商家'
  const [msg, setMsg] = useState(null);          // {ok: bool, text: string}
  /* C9：直接取消订阅（与 AI 同管道，本人确认后执行） */
  const [subCancel, setSubCancel] = useState(null);

  const inputCls = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-sm text-slate-700 '
                 + 'outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition';

  /* 签约代扣：创建 contracted 订阅 + 后端自动补录历史流水，到期自动扣款 */
  const contract = async (e) => {
    e.preventDefault();
    if (!requireBind(phoneBound)) return;      // 未绑手机号 → 引导卡，不发请求
    const formEl = e.currentTarget;   // React 合成事件：await 后 e.currentTarget 会被置 null，先缓存
    const f = new FormData(formEl);
    const fee = parseFloat(f.get('fee'));
    if (!(fee > 0)) { setMsg({ ok: false, text: '请输入正确的订阅费用' }); return; }
    setBusy('contract');
    setMsg(null);
    try {
      const res = await fetch('/api/subscriptions/contract', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          service_name: String(f.get('service_name') || '').trim(),
          merchant: String(f.get('merchant') || '').trim() || undefined,
          fee,
          cycle: String(f.get('cycle') || '月付'),
          first_due: String(f.get('first_due') || '').trim() || undefined,
        }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || ('HTTP ' + res.status));
      formEl.reset();
      setMsg({ ok: true, text: d.message || `已签约代扣「${d.service_name}」` });
      setVer(v => v + 1);
    } catch (err) {
      setMsg({ ok: false, text: '签约失败：' + err.message });
    } finally {
      setBusy(null);
    }
  };

  /* 确认 / 忽略识别候选 */
  const actCandidate = async (action, merchant) => {
    if (!requireBind(phoneBound)) return;       // 确认转正=写操作，未绑定先引导
    setBusy(`${action}:${merchant}`);
    setMsg(null);
    try {
      const res = await fetch(`/api/subscriptions/discover/${action}`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ merchant }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || ('HTTP ' + res.status));
      setMsg({ ok: true, text: d.message || (action === 'confirm' ? '已确认' : '已忽略') });
      setVer(v => v + 1);
    } catch (err) {
      setMsg({ ok: false, text: (action === 'confirm' ? '确认失败：' : '忽略失败：') + err.message });
    } finally {
      setBusy(null);
    }
  };

  /* 已登记但未确认的 identified 订阅 → 一键确认 */
  const confirmSub = async (s) => {
    if (!requireBind(phoneBound)) return;
    setBusy(`sub:${s.id}`);
    setMsg(null);
    try {
      const res = await fetch(`/api/subscriptions/${s.id}/confirm`, { method: 'POST', headers: authHeaders() });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || ('HTTP ' + res.status));
      setMsg({ ok: true, text: d.message || '已确认' });
      setVer(v => v + 1);
    } catch (err) {
      setMsg({ ok: false, text: '确认失败：' + err.message });
    } finally {
      setBusy(null);
    }
  };

  /* 来源徽标：签约代扣=蓝 / 流水识别=紫 */
  const SourceBadge = ({ s }) => {
    if (s.source === 'contracted') return (
      <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-sky-100
                       text-sky-600 text-[10px] font-medium border border-sky-200">
        签约代扣
      </span>
    );
    if (s.source === 'identified') return (
      <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-cyan-100
                       text-cyan-600 text-[10px] font-medium border border-cyan-200">
        {s.confirmed ? '流水识别' : '待确认'}
      </span>
    );
    return null;
  };

  /* 下次扣款提示文案：3 天内到期 → 橙色提醒 */
  const DueText = ({ s }) => {
    if (s.status === 'cancelled' || !s.next_due) return null;
    const urgent = s.due_days != null && s.due_days <= 3;
    return (
      <span className={`inline-flex items-center gap-1 ${urgent ? 'text-orange-600 font-medium' : ''}`}>
        {s.due_days === 0 ? '今天扣款' : s.due_days < 0 ? `逾期 ${-s.due_days} 天` : `${s.next_due} 扣款`}
        {urgent && s.due_days >= 0 && '（临近）'}
      </span>
    );
  };

  return (
    <PageShell className="space-y-5">
      {/* A4：本页金额为 always 级展示，附敏感提示行 */}
      <SensitiveHint />
      <div className="grid grid-cols-2 gap-4">
        <StatCard label="月度订阅总支出" value={ss.data ? ss.data.monthly_total : 0} icon="repeat" tone="violet"
                  sub={ss.data ? `${ss.data.active_count} 项生效中（年付已折算为月度）` : '—'} />
        <StatCard label="闲置订阅" value={idle.count} icon="alert-triangle" tone="amber" raw
                  sub={idle.count ? `每月浪费约 ¥${fmtMoney(idle.monthly_waste)}` : '暂无闲置订阅，订阅结构健康'} />
      </div>

      {msg && (
        <div className={`rounded-xl px-4 py-2.5 text-xs flex items-center gap-2 border animate-slide-up
          ${msg.ok ? 'bg-emerald-50 border-emerald-100 text-emerald-700' : 'bg-rose-50 border-rose-100 text-rose-600'}`}>
          {msg.text}
        </div>
      )}

      {/* 新发现：流水识别引擎挖出的疑似周期扣款（未登记），确认才转正 */}
      {!sd.loading && !sd.error && candidates.length > 0 && (
        <div className="rounded-2xl p-5 animate-slide-up bg-cyan-50 border border-cyan-200">
          <div className="flex items-start gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold text-cyan-900 mb-1">
                从您的账单里发现 {candidates.length} 项疑似订阅扣款
              </div>
              <div className="text-[11px] text-cyan-500 mb-3">
                同一商户按固定周期扣固定金额，但还没登记为订阅 —— 确认后纳入统一管理，到期自动扣款
              </div>
              <div className="space-y-2">
                {candidates.map(c => (
                  <div key={c.merchant}
                       className="flex items-center gap-3 rounded-xl bg-panel/80 border border-cyan-100 px-3.5 py-2.5">
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium text-slate-700 flex items-center gap-2 flex-wrap">
                        {c.merchant}
                        <span className="px-1.5 py-0.5 rounded-full bg-cyan-50 border border-cyan-100
                                         text-cyan-500 text-[10px]">{c.cycle}</span>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5">
                        近 {c.count} 期每期 ¥{fmtMoney(c.avg_amount)} · 末笔 {c.last_date} · 预计下次 {c.estimated_next_due}
                      </div>
                    </div>
                    <button onClick={() => actCandidate('confirm', c.merchant)} disabled={!!busy}
                      className="shrink-0 inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-[11px] font-medium
                                 bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 text-ongold transition-all active:scale-[0.98]">
                      {busy === `confirm:${c.merchant}` ? '确认中…' : '确认订阅'}
                    </button>
                    <button onClick={() => actCandidate('ignore', c.merchant)} disabled={!!busy}
                      className="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[11px]
                                 bg-panel border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:opacity-50 transition">
                      {busy === `ignore:${c.merchant}` ? '…' : '忽略'}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 闲置聚合区：一键交给小微处理 */}
      {!ss.loading && !ss.error && idle.count > 0 && (
        <div className="rounded-2xl p-5 animate-slide-up bg-orange-50 border border-orange-200">
          <div className="flex items-start gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold text-orange-900 mb-1">
                发现 {idle.count} 项闲置订阅，每月浪费约 ¥{fmtMoney(idle.monthly_waste)}
              </div>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {idle.items.map(s => (
                  <span key={s.id}
                    className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-panel/70 border border-orange-200
                               text-[10px] text-orange-800">
                    {s.service_name}
                    <span className="text-orange-500 font-mono">闲置 {s.idle_days} 天</span>
                  </span>
                ))}
              </div>
              {/* 把页面已算出的闲置清单一并交给对话，Agent 无需再追问「是哪几个」 */}
              <ActionBtn tone="amber" className="!px-4 !py-2 !text-xs"
                         text={`帮我取消这些闲置订阅：${idle.items.map(s => s.service_name).join('、')}`}>
                让小微处理这些闲置订阅
              </ActionBtn>
            </div>
          </div>
        </div>
      )}

      {/* 签约代扣：与银行签约一项自动扣费，到期由扣款引擎自动扣款 */}
      <Panel title="签约代扣" icon="repeat"
             right={<span className="text-[11px] text-slate-400">签约后按周期自动扣款，历史账单一并补录</span>}>
        <form onSubmit={contract} className="flex items-end gap-3 flex-wrap">
          <label className="flex-[2] min-w-[160px]">
            <span className="block text-[11px] text-slate-400 mb-1">服务名称</span>
            <input name="service_name" required className={inputCls}
                   placeholder="如：视频平台会员 / 健身房年卡" maxLength={64} />
          </label>
          <label className="w-36 shrink-0">
            <span className="block text-[11px] text-slate-400 mb-1">费用（元/期）</span>
            <input name="fee" type="number" required min="0.01" step="0.01" className={inputCls}
                   placeholder="25.00" />
          </label>
          <label className="w-28 shrink-0">
            <span className="block text-[11px] text-slate-400 mb-1">计费周期</span>
            <select name="cycle" defaultValue="月付" className={inputCls}>
              <option value="月付">月付</option>
              <option value="年付">年付</option>
            </select>
          </label>
          <label className="w-36 shrink-0">
            <span className="block text-[11px] text-slate-400 mb-1">扣款商户（可选）</span>
            <input name="merchant" className={inputCls} placeholder="默认同服务名" maxLength={100} />
          </label>
          <label className="w-40 shrink-0">
            <span className="block text-[11px] text-slate-400 mb-1">首次扣款日（可选）</span>
            <input name="first_due" type="date" className={inputCls} />
          </label>
          <button type="submit" disabled={!!busy}
            className="shrink-0 inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2.5 text-xs font-medium
                       bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed text-ongold
                       shadow-[0_4px_14px_rgba(139,92,246,0.28)] transition-all active:scale-[0.98]">
            {busy === 'contract' ? '签约中…' : '签约代扣'}
          </button>
        </form>
      </Panel>

      <Panel title="订阅列表" icon="repeat"
             right={<span className="text-[11px] text-slate-400">到期自动扣款 · 闲置判定：超过 60 天未使用</span>}>
        {ss.loading ? <Loading /> : ss.error ? <ErrBox text={ss.error} />
          : subs.length === 0 ? <Empty text="暂无订阅记录，可从上方签约或等待账单识别" icon="repeat" />
          : (
            <div className="space-y-2.5">
              {subs.map(s => {
                const cancelled = s.status === 'cancelled';
                const ignored = s.status === 'ignored';
                const dimmed = cancelled || ignored;
                return (
                  <div key={s.id}
                    className={`flex items-center gap-4 rounded-xl border px-4 py-3 transition-all duration-200
                      ${dimmed ? 'border-slate-100 bg-slate-50/60' : 'border-slate-100 hover:border-brand-200 hover:bg-brand-50/30'}`}>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className={`text-sm font-medium ${dimmed ? 'text-slate-400' : 'text-slate-700'}`}
                              style={cancelled ? { textDecoration: 'line-through' } : undefined}>
                          {s.service_name}
                        </span>
                        {!dimmed && <SourceBadge s={s} />}
                        {ignored && (
                          <span className="px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-400 text-[10px]">已忽略</span>
                        )}
                        {!dimmed && s.idle_over_60 && (
                          <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-orange-100
                                           text-orange-700 text-[10px] font-medium border border-orange-200">
                            闲置 · 建议取消
                          </span>
                        )}
                        {cancelled && (
                          <span className="px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-400 text-[10px]">已取消</span>
                        )}
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2 flex-wrap">
                        <span>{s.cycle} · 最后使用 {s.last_used}
                          {s.idle_days != null && !dimmed && `（${s.idle_days} 天前）`}</span>
                        {!dimmed && <DueText s={s} />}
                      </div>
                    </div>
                    <div className="text-right shrink-0">
                      <Amount value={s.fee} className={`text-sm font-semibold ${dimmed ? 'text-slate-400' : ''}`}
                            style={cancelled ? { textDecoration: 'line-through' } : undefined} />
                    </div>
                    <div className="shrink-0 w-32 flex justify-end items-center gap-1.5">
                      {cancelled
                        ? <span className="text-[11px] text-slate-400">已终止</span>
                        : ignored
                          ? <span className="text-[11px] text-slate-400">已忽略</span>
                          : s.confirmed === 0
                            ? <button onClick={() => confirmSub(s)} disabled={!!busy}
                                className="inline-flex items-center rounded-lg px-3 py-1.5 text-[11px] font-medium
                                           bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 text-ongold transition">
                                {busy === `sub:${s.id}` ? '确认中…' : '确认'}
                              </button>
                            : <>
                                <button onClick={() => setSubCancel(s)}
                                        className="px-2 py-0.5 rounded-md text-[10.5px] font-medium border border-line
                                                   text-slate-300 hover:text-rose-300 hover:border-rose-400/40 transition-colors">取消</button>
                                <AskBtn text={`帮我取消${s.service_name}订阅`} label="问小微" compact />
                              </>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
      </Panel>
            {subCancel && (
              <DirectTaskModal title="直接取消订阅" action="cancel_subscription"
                               params={{ sub_id: subCancel.id }}
                               confirmPrompt={`确认取消订阅「${subCancel.service_name}」（¥${fmtMoney(subCancel.fee)}/${subCancel.cycle}）？下一扣费周期生效，历史记录保留。`}
                               onClose={() => setSubCancel(null)} onDone={() => setVer(v => v + 1)} />
            )}
    </PageShell>
  );
}

/* ============================================================
   ⑥ 安全中心页（答辩王牌）
   ============================================================ */
const RISK_RULES = [
  { icon:'shield',   title:'验证码（你有）', desc:'验证码一律发送至站内收件箱（不依赖短信通道），本人登录后才可查看；大额 / 非常用收款人必验' },
  { icon:'lock',     title:'支付密码（你知）', desc:'6 位支付密码，错 3 次锁定至当日 23:59:59；密码不进对话、不落任何记录，只做服务端核验' },
  { icon:'alert-triangle', title:'风险分级组合', desc:'小额且常用：仅支付密码；超 2000 或非常用收款人：验证码+支付密码双要素；超 20000 另加大额警示行' },
  { icon:'alert-triangle', title:'高危业务拒绝代办', desc:'冻结/解冻、取消订阅等高风险操作，仅本人确认后执行，AI 不得代签' },
];

const ACTION_CN = {
  transfer:'转账', card_apply:'申请银行卡', buy_product:'购买理财', redeem:'赎回持仓',
  internal_transfer:'资金归集',
  freeze_card:'冻结银行卡', unfreeze_card:'解冻银行卡', cancel_subscription:'取消订阅',
  verify_send:'发送验证码', verify_check:'校验验证码',
  pay_password_verify:'支付密码核验',
};
const RESULT_CN = { success:'成功', failed:'失败', not_implemented:'未实现' };

function SafePage() {
  const ls = useApi('/api/operation_logs?limit=50');
  const logs = (ls.data && ls.data.logs) || [];

  const total = logs.length;
  const failed = logs.filter(l => l.result === 'failed').length;
  const verified = logs.filter(l => l.action === 'verify_send' || l.action === 'verify_check').length;
  /* B6：身份核验次数 = 验证码校验成功 + 支付密码核验成功 */
  const pwdOk = logs.filter(l => l.action === 'pay_password_verify' && l.result === 'success').length;
  const codeOk = logs.filter(l => l.action === 'verify_check' && l.result === 'success').length;
  const pwdLogs = logs.filter(l => l.action === 'pay_password_verify').slice(0, 10);

  /* 日志图标与配色：成功绿 / 拦截红 / 验证橙 */
  const toneOf = (l) => {
    if (l.result === 'success') return { icon:'check-circle', color:'var(--cat-ok)', bg:'color-mix(in srgb, var(--cat-ok) 12%, transparent)' };
    if (l.action === 'verify_send' || l.action === 'verify_check') return { icon:'lock', color:'var(--cat-warn)', bg:'color-mix(in srgb, var(--cat-warn) 12%, transparent)' };
    return { icon:'shield', color:'var(--cat-danger)', bg:'color-mix(in srgb, var(--cat-danger) 12%, transparent)' };
  };

  return (
    <PageShell className="space-y-5">
      {/* slogan */}
      <div className="rounded-2xl p-5 text-white animate-slide-up relative overflow-hidden"
           style={{ backgroundImage: T.navyCard }}>
        <span className="pointer-events-none absolute -top-20 -right-16 w-64 h-64 rounded-full opacity-15 blur-3xl"
              style={{ background: 'linear-gradient(135deg,#F0D590 0%,#FFFFFF 100%)' }} />
        <div className="relative flex items-center gap-3">
          <div>
            <div className="text-lg font-semibold tracking-wide">每一次操作，都有迹可循</div>
            <div className="text-[11px] text-white/65 mt-0.5">
              所有资金操作均经意图识别、风控校验与本人确认，全过程留痕可追溯
            </div>
          </div>
        </div>
      </div>

      {/* 三连统计 */}
      <div className="grid grid-cols-3 gap-4">
        <StatCard label="累计操作数" value={total} icon="history" tone="blue" raw />
        <StatCard label="身份核验次数" value={codeOk + pwdOk} icon="lock" tone="amber" raw
                  sub="验证码校验 + 支付密码核验（成功）" />
        <StatCard label="拦截次数" value={failed} icon="shield" tone="rose" raw
                  sub="超额 / 越权 / 异常请求" />
      </div>

      {/* B6：支付密码核验日志（含失败留痕） */}
      <Panel title="支付密码核验日志" icon="lock"
             right={<span className="text-[11px] text-slate-400">含失败留痕 · 最近 {pwdLogs.length} 条</span>}>
        {ls.loading ? <Loading /> : pwdLogs.length === 0
          ? <Empty text="暂无支付密码核验记录（首次转账输入密码后生成）" icon="lock" />
          : (
            <ul className="divide-y divide-slate-100">
              {pwdLogs.map(l => (
                <li key={l.id} className="flex items-center gap-3 py-2.5">
                  <span className="text-[12px] text-slate-400 font-mono shrink-0">
                    {l.created_at ? String(l.created_at).slice(5, 16).replace('T', ' ') : ''}
                  </span>
                  <span className={'text-[12px] font-medium ' + (l.result === 'success' ? 'text-emerald-600' : 'text-rose-500')}>
                    {RESULT_CN[l.result] || l.result}
                  </span>
                  <span className="text-[12px] text-slate-500 truncate flex-1">
                    {(() => {
                      try {
                        const d = JSON.parse(l.detail || '{}');
                        if (d.locked) return '触发锁定';
                        if (d.blocked) return '锁定状态拒绝';
                        return '常规核验';
                      } catch (e) { return ''; }
                    })()}
                  </span>
                </li>
              ))}
            </ul>
          )}
      </Panel>

      {/* 操作日志时间线 */}
      <Panel title="操作日志" icon="history"
             right={<span className="text-[11px] text-slate-400">最近 {logs.length} 条 · 倒序</span>}>
        {ls.loading ? <Loading /> : ls.error ? <ErrBox text={ls.error} />
          : logs.length === 0 ? <Empty text="暂无操作记录，试试在对话中办理一笔业务" icon="history" />
          : (
            <ol className="relative">
              {/* 竖向时间线主轴 */}
              <span className="absolute left-[15px] top-2 bottom-2 w-px bg-slate-200" />
              {logs.map(l => {
                const t = toneOf(l);
                const time = l.created_at ? String(l.created_at).slice(5, 16).replace('T', ' ') : '';
                return (
                  <li key={l.id} className="relative flex gap-3.5 pb-4 last:pb-0 group">
                    <span className="relative z-10 w-8 h-8 rounded-full shrink-0"
                          style={{ background: t.bg }} />
                    <div className="flex-1 min-w-0 pt-0.5">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-xs font-medium text-slate-700">
                          {ACTION_CN[l.action] || l.action}
                        </span>
                        <span className="px-1.5 py-0.5 rounded-full text-[10px] font-medium"
                              style={{ background: t.bg, color: t.color }}>
                          {RESULT_CN[l.result] || l.result}
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono">{time}</span>
                      </div>
                      {l.detail && (
                        <div className="text-[11px] text-slate-400 mt-1 font-mono break-all group-hover:text-slate-500 transition-colors">
                          {l.detail}
                        </div>
                      )}
                    </div>
                  </li>
                );
              })}
            </ol>
          )}
      </Panel>

      {/* 风控规则：透明化，体现"安全不是黑盒" */}
      <Panel title="风控规则" icon="shield-check"
             right={<span className="text-[11px] text-slate-400">规则公开可查</span>}>
        <div className="grid grid-cols-3 gap-3">
          {RISK_RULES.map(r => (
            <div key={r.title} className="rounded-xl border border-slate-100 p-4 hover:border-brand-200 transition-colors">
              <div className="text-xs font-medium text-slate-700 mt-2.5 mb-1">{r.title}</div>
              <div className="text-[11px] text-slate-400 leading-relaxed">{r.desc}</div>
            </div>
          ))}
        </div>
        <div className="mt-3.5 pt-3 border-t border-slate-100 flex items-center gap-1.5 text-[10px] text-slate-400">
          以上规则在对话式办理过程中自动生效，无需您手动配置
        </div>
      </Panel>
    </PageShell>
  );
}

/* ============================================================
   ④ 个人中心页（用户信息体系）
   —— 延续深色科技风；查看/编辑个人信息；保存后体验闭环到对话页
   ============================================================ */
const GENDER_OPTS = [
  { value: 'male',   label: '男' },
  { value: 'female', label: '女' },
  { value: 'other',  label: '其他' },
];
const RISK_OPTS = [
  { value: '稳健', label: '稳健' },
  { value: '平衡', label: '平衡' },
  { value: '进取', label: '进取' },
];

/* 通用分段控件（segmented） */
function Seg({ value, options, onChange }) {
  return (
    <div className="inline-flex p-1 rounded-xl bg-slate-100 gap-1">
      {options.map(o => (
        <button key={o.value} type="button" onClick={() => onChange(o.value)}
          className={`px-4 py-1.5 rounded-lg text-[13px] font-medium transition-all duration-150
            ${value === o.value
              ? 'bg-panel text-brand-700 shadow-sm'
              : 'text-slate-500 hover:text-slate-700'}`}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

/* ============================================================
   手机号绑定卡（渐进式账户核心模块）
   —— 未绑定：手机号输入 → 发送验证码（60s 倒计时）→ 6 格验证码 → 完成绑定
   —— 已绑定：脱敏号 + 「更换手机」文字按钮（点开走同一套流程）
   ★ 验证码复用既有基础设施（scene='phone_bind'，与转账验证码隔离），
     送达站内收件箱；绑定成功写入 operation_logs(action='phone_bind')。
   ★ 页面上绝不出现完整手机号：只展示后端派生的 phone_masked（138****8888）。
   ============================================================ */
function PhoneBindCard({ profile, onChanged, modeChange }) {
  const bound = !!(profile && profile.phone_bound);
  const masked = (profile && profile.phone_masked) || '';
  // modeChange：已绑定用户从用户卡点「更换」进来 → 直接进入更换态
  const [changing, setChanging] = useState(!!modeChange);
  const [phone, setPhone] = useState('');
  const [code, setCode] = useState(['', '', '', '', '', '']);
  const [left, setLeft] = useState(0);                   // 重发倒计时（秒）
  const [msg, setMsg] = useState(null);                  // {ok, text}
  const [busy, setBusy] = useState(false);
  const refs = useRef([]);

  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => setLeft(v => v - 1), 1000);
    return () => clearTimeout(t);
  }, [left]);

  const showForm = !bound || changing;
  const codeStr = code.join('');
  const phoneOk = /^1\d{10}$/.test(phone);

  /* 6 格输入：填一位自动跳下一格；退格回退一格 */
  const setDigit = (i, v) => {
    const d = (v || '').replace(/\D/g, '').slice(-1);
    setCode(c => { const n = c.slice(); n[i] = d; return n; });
    if (d && i < 5 && refs.current[i + 1]) refs.current[i + 1].focus();
  };
  const onKey = (i, e) => {
    if (e.key === 'Backspace' && !code[i] && i > 0 && refs.current[i - 1]) refs.current[i - 1].focus();
  };

  const send = async () => {
    setMsg(null);
    if (!phoneOk) { setMsg({ ok: false, text: '请输入正确的 11 位手机号（以 1 开头）' }); return; }
    setBusy(true);
    try {
      const res = await fetch('/api/profile/phone/bind-request', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ phone }),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok) {
        setMsg({ ok: true, text: `验证码已发送至您的收件箱，${d.expires_in || 300} 秒内有效` });
        setLeft(60);
        setCode(['', '', '', '', '', '']);
        if (refs.current[0]) refs.current[0].focus();
      } else {
        setMsg({ ok: false, text: d.error || d.detail || '发送失败' });
      }
    } catch (e) { setMsg({ ok: false, text: '网络错误' }); }
    setBusy(false);
  };

  const confirm = async () => {
    setMsg(null);
    if (codeStr.length !== 6) { setMsg({ ok: false, text: '请输入 6 位验证码' }); return; }
    setBusy(true);
    try {
      const res = await fetch('/api/profile/phone/bind-confirm', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ code: codeStr }),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok) {
        setMsg({ ok: true, text: '手机号绑定成功' });
        setChanging(false);
        setPhone('');
        setCode(['', '', '', '', '', '']);
        setLeft(0);
        if (onChanged) onChanged(d);        // 广播刷新：各处写按钮的拦截立即解除
      } else {
        setMsg({ ok: false, text: d.error || d.detail || '绑定失败' });
      }
    } catch (e) { setMsg({ ok: false, text: '网络错误' }); }
    setBusy(false);
  };

  /* 已绑定且未在更换 → 收起成一行：脱敏号 + 更换手机 */
  if (!showForm) {
    return (
      <Panel title="手机号"
             right={<span className="text-[11px] text-emerald-600">手机已绑定</span>}>
        <div className="flex items-center justify-between gap-4">
          <div className="text-[13px] text-slate-700 font-mono">{masked || '—'}</div>
          <button type="button" onClick={() => { setChanging(true); setMsg(null); }}
            className="px-3.5 py-2 rounded-xl text-[12px] font-medium text-brand-600 bg-brand-50
                       border border-brand-100 hover:bg-brand-100 transition-colors">
            更换手机
          </button>
        </div>
        {msg && <div className="mt-2 text-[12px] text-emerald-600">{msg.text}</div>}
      </Panel>
    );
  }

  return (
    <Panel title={bound ? '更换手机号' : '绑定手机号'}
           right={<span className="text-[11px] text-amber-600">
             {bound ? '核验原手机号后更换' : '绑定后可办理资金业务'}
           </span>}>
      <div className="space-y-3">
        {/* 手机号 + 发送验证码（60s 倒计时） */}
        <div className="flex items-center gap-2 flex-wrap">
          <input value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g, '').slice(0, 11))}
            inputMode="numeric" maxLength={11} placeholder="请输入 11 位手机号"
            className="w-52 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-sm font-mono
                       text-slate-700 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition" />
          <button type="button" onClick={send} disabled={busy || left > 0 || !phoneOk}
            className="px-3.5 py-2.5 rounded-xl text-[12px] font-medium text-brand-600 bg-brand-50
                       border border-brand-100 hover:bg-brand-100 disabled:opacity-40
                       disabled:cursor-not-allowed transition-colors">
            {left > 0 ? `${left}s 后重发` : '发送验证码'}
          </button>
          {bound && (
            <button type="button" onClick={() => { setChanging(false); setMsg(null); setPhone(''); setCode(['', '', '', '', '', '']); }}
              className="px-3 py-2.5 rounded-xl text-[12px] font-medium text-slate-500 hover:text-slate-700 transition-colors">
              取消
            </button>
          )}
        </div>

        {/* 6 格验证码 + 完成绑定 */}
        <div className="flex items-center gap-2 flex-wrap">
          {code.map((d, i) => (
            <input key={i} ref={el => { refs.current[i] = el; }} value={d}
              onChange={e => setDigit(i, e.target.value)} onKeyDown={e => onKey(i, e)}
              inputMode="numeric" maxLength={1} aria-label={`验证码第 ${i + 1} 位`}
              className="w-11 h-12 text-center text-[18px] font-mono rounded-xl border border-slate-200
                         bg-panel text-slate-700 outline-none focus:border-brand-400
                         focus:ring-2 focus:ring-brand-100 transition" />
          ))}
          <button type="button" onClick={confirm} disabled={busy || codeStr.length !== 6}
            className="ml-1 px-4 py-2.5 rounded-xl text-[12px] font-semibold text-ongold bg-brand-600
                       hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
            {busy ? '处理中…' : '完成绑定'}
          </button>
        </div>

        <div className="text-[11px] text-slate-400">
          验证码已发送至您的收件箱
          <button type="button" onClick={openInbox}
            className="ml-1.5 text-brand-600 hover:text-brand-700 underline underline-offset-2">
            打开收件箱
          </button>
          ；5 分钟内有效，错 3 次作废。资金操作需要手机验证码保护。
        </div>

        {msg && (
          <div className={'text-[12px] ' + (msg.ok ? 'text-emerald-600' : 'text-rose-500')}>{msg.text}</div>
        )}
      </div>
    </Panel>
  );
}

/* ============================================================
   实名认证（C3-验收#3）：验证码同样走站内收件箱送达
   —— 发码 → 收件箱取码 → 核验通过才落 users.real_name

   ★ 一旦完成，禁止在线修改（敏感身份变更必须柜台办理）：
     - 前端：realname_verified=true 时只展示只读态 + 柜台提示，**不暴露修改表单**；
     - 后端：/api/realname/confirm 同样会再挡一道（防绕过前端直接打 API）。
   ============================================================ */
function RealnameCard({ currentName, verified }) {
  const [name, setName] = useState(currentName || '');
  const [code, setCode] = useState('');
  const [msg, setMsg] = useState(null);      // {ok, text}
  const [busy, setBusy] = useState(false);

  const send = async () => {
    setBusy(true); setMsg(null);
    try {
      const res = await fetch('/api/realname/send_code', { method: 'POST', headers: authHeaders() });
      const d = await res.json().catch(() => ({}));
      setMsg(res.ok && d.ok ? { ok: true, text: '验证码已发送至您的收件箱，5 分钟内有效' } : { ok: false, text: d.detail || '发送失败' });
    } catch (e) { setMsg({ ok: false, text: '网络错误' }); }
    setBusy(false);
  };
  const confirm = async () => {
    setBusy(true); setMsg(null);
    try {
      const res = await fetch('/api/realname/confirm', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ real_name: name, code }),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok) {
        setMsg({ ok: true, text: '实名认证完成' });
        setCode('');
        setTimeout(() => window.location.reload(), 1200);
      } else {
        setMsg({ ok: false, text: d.error || d.detail || '验证失败' });
      }
    } catch (e) { setMsg({ ok: false, text: '网络错误' }); }
    setBusy(false);
  };

  // ★ 已完成实名认证 → 只读态：展示认证结果 + 柜台提示，**不**暴露修改入口
  if (verified) {
    return (
      <Panel title="实名认证">
        <div className="space-y-2.5">
          <div className="flex items-center gap-2">
            <span className="text-[12px] font-semibold text-emerald-700">✓</span>
            <span className="text-[13px] font-semibold text-slate-700">已实名认证</span>
          </div>
          {currentName ? (
            <div className="text-[12px] text-slate-500">
              认证姓名：<span className="font-mono text-slate-700">{currentName}</span>
            </div>
          ) : null}
          <div className="text-[11px] text-slate-400 leading-relaxed">
            姓名属于敏感身份信息，认证完成后不可在线修改。如需变更，请携带有效证件前往柜台办理。
          </div>
        </div>
      </Panel>
    );
  }

  return (
    <Panel title="实名认证" icon="shield">
      <div className="space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <input value={name} onChange={e => setName(e.target.value)} maxLength={20} placeholder="真实姓名"
            className="w-44 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-sm text-slate-700
                       outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition" />
          <input value={code} onChange={e => setCode(e.target.value.replace(/\D/g, '').slice(0, 6))}
            inputMode="numeric" placeholder="6 位验证码"
            className="w-40 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-[16px] font-mono
                       tracking-[0.25em] text-slate-700 outline-none focus:border-brand-400 transition" />
          <button onClick={send} disabled={busy || !name.trim()}
            className="px-3.5 py-2.5 rounded-xl text-[12px] font-medium text-brand-600 bg-brand-50
                       border border-brand-100 hover:bg-brand-100 disabled:opacity-40 transition-colors">
            发送验证码
          </button>
          <button onClick={confirm} disabled={busy || code.length < 4 || !name.trim()}
            className="px-4 py-2.5 rounded-xl text-[12px] font-semibold text-ongold bg-brand-600
                       hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
            {busy ? '处理中…' : '提交认证'}
          </button>
        </div>
        <div className="text-[11px] text-slate-400">
          验证码发送至站内收件箱（右上角打开），核验通过后即完成实名。
        </div>
        {msg && (
          <div className={'text-[12px] ' + (msg.ok ? 'text-emerald-600' : 'text-rose-500')}>{msg.text}</div>
        )}
      </div>
    </Panel>
  );
}

/* C7 信息架构：ProfilePage 页面形式已下线 —— 资料编辑 / 实名认证 / 手机绑定
   改为顶栏用户菜单 → ProfileModal / RealnameModal 弹窗（见 App）。
   /profile、/realname 旧路由由 App 重定向到对话页并自动弹窗。

/* ============================================================
   ⑦ 转账页（二级页 · /transfer）
   —— 四步：选收款人 → 填金额 → 核对 → 安全执行

   ★★ 设计铁律：本页表单只负责「收集参数」，绝不直调 POST /api/transfer。
      点提交后一律走 POST /api/chat/submit-task，由 LangGraph write_flow 跑完整
      安全流程：risk_check →（命中风控则）verify 中断 → confirm 中断 → execute。
      所以「不点确认，钱一定不会动」这条不变式在表单路径上同样成立 ——
      前端连转账的执行入口都没有，想绕也绕不过去。
   ★  与对话内自然语言转账殊途同归：同一张图、同一套风控、同一份留痕
      （operation_logs + chat_messages 写回同一 conversation_id）。
   ============================================================ */

/* 页面内 SSE 读取器：与对话页 /api/chat/stream 同协议（`data: {json}` + 空行分帧）。
   没有复用 App.realSend —— 那份与聊天消息流状态强耦合，硬抽出来反而更难维护。
   onEvent 返回 true 表示终帧，立即停止读取并放掉连接。 */
async function streamTask(url, body, onEvent) {
  const res = await fetch(url, {
    method: 'POST',
    // 数字柜员开关随请求下发：后端据此决定是否喂话（关闭态零调用）
    headers: authHeaders({
      'Content-Type': 'application/json',
      'X-Digital-Human': localStorage.getItem('xb_digital_human') === '1' ? '1' : '0',
    }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || d.error || ('HTTP ' + res.status));
  }
  if (!res.body) throw new Error('服务端未返回事件流');
  const reader = res.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let sep;
    while ((sep = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, sep);
      buf = buf.slice(sep + 2);
      const line = frame.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
      if (onEvent(ev)) { reader.cancel().catch(() => {}); return; }
    }
  }
}

/* ============================================================
   C9 通用「直接办理」弹窗：人工操作与 AI 对话殊途同归
   —— 人工在页面上的购买 / 赎回 / 冻结 / 取消等操作，与 AI 对话
      走同一条 write_flow 安全管道（POST /api/chat/submit-task）：
      风控分级 → 验证码/支付密码 → 本人确认卡 → 执行回执 → 全程留痕。
      区别只是入口：AI 更方便，人也可以自己操作。
   ============================================================ */
function DirectTaskModal({ title, action, params, confirmPrompt, onClose, onDone }) {
  const [phase, setPhase] = useState(confirmPrompt ? 'gate' : 'run');   // gate|run|verify|confirm|done|error
  const [nodes, setNodes] = useState([]);
  const [verifyInfo, setVerifyInfo] = useState(null);
  const [confirmCard, setConfirmCard] = useState(null);
  const [result, setResult] = useState(null);
  const [errText, setErrText] = useState('');
  const [busy, setBusy] = useState(false);
  const startedRef = useRef(false);
  const convId = localStorage.getItem('xb_thread') || 'web';

  const applyPayload = (p) => {
    if (!p) { setErrText('服务端未返回结果'); setPhase('error'); return; }
    if (p.kind === 'verify') {
      setVerifyInfo({ factor: p.factor || p.verify, need_set: p.need_set, queue: p.queue || [] });
      setPhase('verify'); return;
    }
    if (p.kind === 'confirm') {
      setConfirmCard({ fields: p.fields || [], amount: p.amount });
      setPhase('confirm'); return;
    }
    setResult({ reply: p.reply || '', receipt: p.receipt || null });
    setPhase('done');
  };
  const onEvent = (ev) => {
    if (!ev || !ev.type) return false;
    if (ev.type === 'node') {
      const item = { node: ev.node, label: ev.label, phase: ev.phase, detail: ev.detail };
      setNodes(ns => {
        const i = ns.findIndex(n => n.node === ev.node);
        if (i < 0) return ns.concat([item]);
        const out = ns.slice(); out[i] = item; return out;
      });
      return false;
    }
    if (ev.type === 'done') { applyPayload(ev.payload); return true; }
    if (ev.type === 'error') { setErrText(ev.detail || '执行失败'); setPhase('error'); return true; }
    return false;
  };
  const run = (url, body) => {
    setBusy(true);
    streamTask(url, body, onEvent)
      .catch(err => { setErrText(err.message || '网络错误'); setPhase('error'); })
      .finally(() => setBusy(false));
  };
  const start = () => run('/api/chat/submit-task',
    { conversation_id: convId, task: { type: 'write', action, params } });
  const resume = (value) => run('/api/chat/resume', { conversation_id: convId, resume: value });

  useEffect(() => {
    if (!confirmPrompt && !startedRef.current) { startedRef.current = true; start(); }
  }, []);

  const btnGold = 'rounded-xl text-[13px] font-semibold text-[#1A1408] transition-all duration-200 hover:brightness-110 disabled:opacity-50';
  const btnGhost = 'rounded-xl px-4 py-2 text-[12px] text-slate-400 hover:text-slate-200 transition-colors';

  return (
    <div className="fixed inset-0 z-[85] flex items-center justify-center px-4"
         style={{ background: 'rgba(4,7,12,0.55)', backdropFilter: 'blur(3px)' }}
         onClick={phase === 'run' || phase === 'verify' ? undefined : onClose}>
      <div className="w-[560px] max-w-full max-h-[86vh] flex flex-col rounded-2xl border slide-up"
           style={{ background: 'rgba(13,19,29,0.94)', backdropFilter: 'blur(20px)',
                    borderColor: 'rgba(212,160,23,0.25)',
                    boxShadow: '0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05)' }}
           onClick={e => e.stopPropagation()}>
        <div className="shrink-0 flex items-center justify-between px-6 py-4 border-b border-white/10">
          <span className="text-[16px] font-semibold text-[#F0D590]">{title}</span>
          {(phase === 'done' || phase === 'error' || phase === 'gate') && (
            <button onClick={onClose} className="text-[12px] text-white/45 hover:text-white transition-colors">关闭</button>
          )}
        </div>

        <div className="flex-1 min-h-0 overflow-y-auto scroll-thin p-6">
          {phase === 'gate' && (
            <div>
              <div className="text-[13.5px] text-slate-300 leading-relaxed">{confirmPrompt}</div>
              <div className="mt-3 text-[11px] text-slate-500 leading-relaxed">
                提交后将走与 AI 对话完全相同的安全流程：风险核验 →（大额）支付密码 → 本人确认 → 执行，全程留痕。
              </div>
              <div className="mt-5 flex justify-end gap-2.5">
                <button onClick={onClose} className={btnGhost}>取消</button>
                <button onClick={() => { startedRef.current = true; setPhase('run'); start(); }}
                        className={btnGold + ' px-5 py-2.5'}>确认，开始办理</button>
              </div>
            </div>
          )}

          {phase === 'run' && (
            <div>
              {nodes.length === 0
                ? <div className="text-[12px] text-slate-500 py-6 text-center">正在提交到安全工作流…</div>
                : <NodeTimeline nodes={nodes} />}
            </div>
          )}

          {phase === 'verify' && (
            <VerifyPanel info={verifyInfo} busy={busy}
                         onCodeSubmit={(c) => resume(c)}
                         onPasswordPassed={(needSet) => resume(needSet ? PWD_SET_PLACEHOLDER : PWD_RESUME_PLACEHOLDER)} />
          )}

          {phase === 'confirm' && confirmCard && (
            <ConfirmCard stage="pending" fields={confirmCard.fields} amount={confirmCard.amount}
                         onConfirm={() => resume('确认')} onCancel={() => resume('取消')} />
          )}

          {phase === 'done' && (
            <div>
              <div className="flex items-center gap-3">
                <span className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[18px] font-semibold"
                      style={{ background: 'rgba(47,208,122,0.15)', color: '#2FD07A' }}>✓</span>
                <span className="text-[15px] font-semibold text-emerald-600">办理完成</span>
              </div>
              <div className="mt-3 text-[13px] text-slate-300 leading-relaxed">{result && result.reply}</div>
              {result && result.receipt && result.receipt.serial_no && (
                <div className="mt-2 text-[11px] text-slate-500 font-mono">流水号 {result.receipt.serial_no}</div>
              )}
              <div className="mt-4 text-[11px] text-slate-500">本笔操作已写入对话留痕与操作审计，可在「安全中心」查看。</div>
            </div>
          )}

          {phase === 'error' && (
            <div>
              <div className="flex items-center gap-3">
                <span className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[18px] font-semibold"
                      style={{ background: 'rgba(229,72,77,0.15)', color: '#E5484D' }}>!</span>
                <span className="text-[14px] font-medium text-slate-200 leading-relaxed">{errText || '本次未完成'}</span>
              </div>
              <div className="mt-3 text-[11px] text-slate-500">资金未发生变动（或流程未执行）。可关闭后重试，或让小微协助办理。</div>
            </div>
          )}
        </div>

        {(phase === 'done' || phase === 'error') && (
          <div className="shrink-0 px-6 py-4 border-t border-white/10 flex justify-end">
            <button onClick={() => { onClose(); onDone && onDone(); }}
                    className={btnGold + ' px-5 py-2.5'}>完成</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* 顶部步骤条 */

    <div className="flex items-center gap-2">

        return (
          <React.Fragment key={label}>
            <div className="flex items-center gap-2 shrink-0">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-semibold transition-all
                ${state === 'done'   ? 'bg-emerald-500 text-white'
                : state === 'active' ? 'text-white shadow-[0_4px_12px_rgba(184,134,11,0.3)]'
                                     : 'bg-slate-100 text-slate-400'}`}
                    style={state === 'active' ? { backgroundImage: T.amberEdge } : undefined}>
                {n}
              </span>
              <span className={`text-[12px] font-medium ${state === 'todo' ? 'text-slate-400' : 'text-slate-700'}`}>
                {label}
              </span>
            </div>
            {n < items.length && (
              <span className={`flex-1 h-[2px] rounded-full ${n < step ? 'bg-emerald-400' : 'bg-slate-100'}`} />

};

/* 安全流程时间线：由 write_flow 的 node 帧驱动，让用户看见"钱是怎么被审的" */
const NodeTimeline = ({ nodes }) => {
  if (!nodes.length) return null;
  const tone = ph => (
    ph === 'done'  ? { c: 'text-emerald-600', b: 'bg-emerald-100', i: 'check' }
  : ph === 'error' ? { c: 'text-rose-500',    b: 'bg-rose-100',    i: 'x' }
  : ph === 'wait'  ? { c: 'text-amber-600',   b: 'bg-amber-100',   i: 'clock' }
  : ph === 'retry' ? { c: 'text-amber-600',   b: 'bg-amber-100',   i: 'refresh' }
                   : { c: 'text-brand-600',   b: 'bg-brand-100',   i: 'loader' });
  return (
    <ol className="space-y-2.5">
      {nodes.map(n => {
        const t = tone(n.phase);
        return (
          <li key={n.node} className="flex items-start gap-2.5 animate-slide-up">
            <span className={`w-5 h-5 mt-[1px] shrink-0 rounded-full ${t.b}`} />
            <div className="min-w-0">
              <div className={`text-[13px] font-medium ${t.c}`}>{n.label || n.node}</div>
              {n.detail && <div className="text-[11px] text-slate-400 mt-0.5 leading-relaxed">{n.detail}</div>}
            </div>
          </li>
        );
      })}
    </ol>
  );
};

/* BankSelect —— 开户行下拉选择器（数据源：bank_directory）
   ★ 银行不允许自由填写：新增收款人的 bank_id 必须来自银行目录。
   模拟真实银行 App 的选择体验：搜索框 + 列表，每行「银行名 + bank_code 小字」，
   本行（微众银行）带「本行」标记并排在最前（后端已按 is_local 排序）。 */

  const sel = banks.find(b => b.id === value) || null;

          {sel ? sel.bank_name : '请选择开户银行'}

        <span className="text-slate-400 text-[11px] shrink-0">{open ? '收起' : '选择'}</span>
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-full rounded-xl border border-slate-200 bg-panel
                        shadow-[0_10px_30px_rgba(15,23,42,0.12)] max-h-64 overflow-auto">
          <div className="p-2 border-b border-slate-100">
            <input autoFocus value={q} onChange={e => setQ(e.target.value)}
                   placeholder="搜索银行名称 / 代码"
                   className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-[12px]
                              text-slate-700 outline-none focus:border-brand-400" />
          </div>
          {list.length === 0 ? (

          ) : list.map(b => (
            <button key={b.id} type="button"
                    onClick={() => { onChange(b.id); setOpen(false); setQ(''); }}
                    className={'w-full text-left px-3 py-2 flex items-center justify-between '
                      + 'hover:bg-slate-50 ' + (b.id === value ? 'bg-brand-50/60' : '')}>
              <span className="text-[13px] text-slate-700">{b.bank_name}
                {b.is_local ? (
                  <span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50

            </button>
