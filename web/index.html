        <span className="text-[12px] text-slate-400 flex-1 truncate">
          {speech && speech.note
            ? speech.note
            : (vd.echo > 0
              ? '已忽略 ' + vd.echo + ' 句（像是小微自己的声音，不算你说的话）'
              : ((speech && speech.interim) || hint))}
        </span>
        {vd.state === 'speaking' && (
          <button type="button" onClick={vd.interrupt}
            className="shrink-0 rounded-lg border border-slate-200 bg-panel px-3 py-1.5 text-[13px] text-slate-600
                       hover:border-slate-300 hover:text-slate-800 transition-all duration-200">
            打断
          </button>
        )}
        <button type="button" onClick={vd.toggle}
          className="shrink-0 rounded-lg border border-slate-200 bg-panel px-3 py-1.5 text-[13px] text-slate-500
                     hover:border-slate-300 hover:text-slate-700 transition-all duration-200">
          退出对话
        </button>
      </div>
    </div>
  );
}

function ChatInput({ input, setInput, onSend, onQuickSend, typing, inputRef, speech, vd, pendingN = 0 }) {
  const [focused, setFocused] = useState(false);
  const [flash, setFlash] = useState(false);   // 快捷操作点击发送 → 输入区短暂高亮
  /* ★ 这里刻意**不**再带 `!typing`：等待期间也允许发送。
     新消息不会与当前轮并发提交，而是进 App 的排队队列（queuedRef），
     当前轮结束后只提交最后一条 —— 见 drainRound()。 */
  const canSend = !!input.trim();

  /* 识别器由上层（App）持有并下传：普通模式只填输入框；「与小微对话」模式由状态机驱动。
     —— 全页只允许一个 SpeechRecognition 实例，故不能在这里自建。 */
  const voiceOff = !speech.supported || !speech.secure;
  const vdOn = !!(vd && vd.on);
  const vdBusy = vdOn && vd.state === 'thinking';
  const voiceTitle = !speech.supported
    ? '当前浏览器不支持语音输入（建议使用 Chrome / Edge）'
    : (!speech.secure
      ? '语音输入需要以 https 或 localhost 访问本页'
      : (vdOn
        ? (vd.state === 'listening' ? '说完了点一下，立即发送'
          : (vd.state === 'speaking' ? '点一下打断小微说话' : '小微正在思考…'))
        : (speech.listening ? '正在聆听：再点一下麦克风结束' : '点一下麦克风开始说话，识别结果会填进输入框')));

  /* 麦克风按钮：普通模式 = 开始/结束识别；对话模式 = 立即发送 / 打断 / 重开麦克风 */
  const onMic = () => {
    if (!vdOn) { speech.toggle(); return; }
    if (vd.state === 'speaking') { vd.interrupt(); return; }
    if (vd.state === 'listening') {
      if (!speech.listening) { vd.restart(); return; }   // 识别器没在跑（被拒/被停）→ 重开
      vd.commit(); return;
    }
  };

  /* 文本域自增高：单行起步，超过 168px 后内部滚动 */
  const autoGrow = () => {
    const el = inputRef && inputRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = `${Math.min(el.scrollHeight, 168)}px`;
  };
  useEffect(() => { autoGrow(); }, [input]);

  /* 发送后 refocus + 高度复位（清空由父级 handleSend 负责） */
  const submit = () => {
    if (!canSend) return;
    onSend();
    requestAnimationFrame(() => {
      const el = inputRef && inputRef.current;
      if (el) el.focus();
      autoGrow();
    });
  };

  /* Enter 发送 / Shift+Enter 换行；输入法组合态不拦截（中文候选词的回车确认） */
  const onKeyDown = (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    if (e.nativeEvent && e.nativeEvent.isComposing) return;
    e.preventDefault();
    submit();
  };

  /* 快捷操作：发送类一击即发（输入框已有内容则追加而非覆盖），跳转类直接路由。
     发送时给输入区一个短暂高亮，明确"这条已经发出去了"。 */
  const onQuick = (a) => {
    if (a.act === 'goto') { navigate(a.to); return; }
    setFlash(true);
    setTimeout(() => setFlash(false), 620);
    const base = (input || '').trim();
    const text = base ? `${base} ${a.text}` : a.text;
    if (onQuickSend) onQuickSend(text);
  };

  return (
    <div className="shrink-0 bg-gradient-to-t from-canvas via-canvas to-transparent pt-5 pb-6 px-8">
      {/* 整体卡片容器：chips + 输入框 合并为聚拢容器 */}
      <div className="mx-auto max-w-3xl bg-panel rounded-3xl border border-slate-200/80 shadow-[0_8px_28px_rgba(212,160,23,0.10)] px-5 pt-4 pb-3.5">

        {/* 快捷操作：4 个等宽行动卡（非小 chips）—— 主文字/副文字颜色随主题（qa-card 自带色） */}
        <div className="grid grid-cols-4 gap-2.5 mb-3">
          {CHAT_QUICK_ACTIONS.map(a => (
            <button key={a.label} type="button" onClick={() => onQuick(a)}
              className="qa-card flex flex-col items-start gap-1 px-3.5 py-2.5 text-left">
              <span className="text-[15px] font-medium leading-tight">{a.label}</span>
              <span className="text-[12px] leading-tight" style={{ color: 'rgb(var(--qa-hint) / 0.45)' }}>{a.hint}</span>
            </button>
          ))}
        </div>

        {typing && (
          <div className="mb-2.5 pl-1">
            <TypingDots />
          </div>
        )}

        {/* 语音状态行：仅普通模式显示（对话模式由上方 VoiceDialogBar 统一显示） */}
        {!vdOn && (speech.listening || speech.note) && (
          <div className="mb-2.5 pl-1 text-[12px] leading-tight"
               style={{ color: speech.note ? '#e11d48' : 'rgb(var(--qa-hint) / 0.60)' }}>
            {speech.note
              ? speech.note
              : ('识别中…' + (speech.interim ? (' ' + speech.interim) : ' 请对着麦克风说话，说完再点一下麦克风'))}
          </div>
        )}

        {/* 输入行：一体化容器（圆角 24px 内嵌，focus 时金色 ring）
            内部 flex：文本域 flex-1 + 右侧「麦克风图标」+「发送」文字按钮 */}
        <div className={`flex items-end gap-3 px-5 py-2 rounded-3xl border-2 transition-all duration-200 ${focused
          ? 'border-brand-400 bg-panel shadow-[0_0_0_5px_rgba(212,160,23,0.16)]'
          : 'border-slate-200 bg-slate-50/70'} ${flash ? 'qa-flash' : ''}`}>
          <textarea value={input}
            ref={inputRef}
            rows={1}
            onChange={e => setInput(e.target.value)}
            onFocus={() => setFocused(true)}
            onBlur={() => setFocused(false)}
            onKeyDown={onKeyDown}
            placeholder="和小微聊聊，比如：这个月钱都花哪儿了？（Enter 发送，Shift+Enter 换行）"
            className="flex-1 bg-transparent text-[16px] text-slate-700 placeholder:text-slate-400 outline-none
                       leading-normal resize-none py-2.5 max-h-[168px]" />

          {/* 麦克风图标按钮（输入框右侧、发送键左侧）：点一下开始、再点一下结束。
              「与小微对话」模式下变为「立即发送 / 打断」。录音中变红并呼吸。 */}
          <button type="button" onClick={onMic} disabled={voiceOff || vdBusy}
            aria-label={vdOn
              ? (vd.state === 'listening' ? '发送这次说话' : (vd.state === 'speaking' ? '打断小微说话' : '小微正在思考'))
              : (speech.listening ? '结束语音输入' : '开始语音输入')}
            aria-pressed={speech.listening}
            title={voiceTitle}
            className={`shrink-0 flex items-center justify-center w-[42px] h-[42px] rounded-xl border
                        transition-all duration-200 disabled:cursor-not-allowed disabled:opacity-40
                        ${speech.listening
                          ? 'border-rose-300 bg-rose-50 text-rose-600'
                          : 'border-slate-200 text-slate-400 hover:border-slate-300 hover:text-slate-600'}`}>
            <MicGlyph live={speech.listening} />
          </button>

          {/* 0 icon：纯文字发送按钮，不再依赖任何图标资源
              金色主按钮：金底深字（对比度优先）；禁用态中性弱化 */}
          <button type="button" onClick={submit} disabled={!canSend} aria-label="发送"
            className="shrink-0 rounded-lg px-4 py-2.5 text-[15px] font-medium leading-normal whitespace-nowrap
                       transition-all duration-200 hover:brightness-110
                       disabled:cursor-not-allowed disabled:hover:brightness-100"
            style={canSend
              ? { backgroundImage: T.blueIndigo, color: '#1A1408', boxShadow: '0 6px 18px rgba(212,160,23,0.28)' }
              : { background: 'rgba(127,127,127,0.12)', color: 'rgba(127,127,127,0.45)', boxShadow: 'none' }}>
            {typing
              ? <span className="tracking-[0.1em]">排 队</span>
              : <span className="tracking-[0.1em]">发 送</span>}
          </button>
        </div>

        {/* ★ 排队提示：小微还在回答时你又发了消息 → 明确告知规则，避免以为石沉大海 */}
        {pendingN > 0 && (
          <div className="mt-2 px-1 text-[11.5px] leading-relaxed text-slate-400">
            已排队 {pendingN} 条 · 小微答完这条后只回答你最后问的那句，其余会问你是否还要继续
          </div>
        )}
      </div>
    </div>
  );
}

/* 环形图：分类占比。data = [{ name, value, color }] */
function DonutChart({ data, size = 168, thickness = 24 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  if (!total) {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" className="stroke-slate-200" strokeWidth={thickness} />
      </svg>
    );
  }
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
      <g transform={`rotate(-90 ${size/2} ${size/2})`}>
        {data.map((d, i) => {
          const len = (d.value / total) * c;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r}
              fill="none" stroke={d.color} strokeWidth={thickness}
              strokeDasharray={`${len} ${c - len}`} strokeDashoffset={-offset} />
          );
          offset += len;
          return el;
        })}
      </g>
      <text x={size/2} y={size/2 - 4} textAnchor="middle" className="fill-slate-400" style={{ fontSize: 11 }}>总支出</text>
      <text x={size/2} y={size/2 + 15} textAnchor="middle" className="fill-gold-600 font-mono"
            style={{ fontSize: 15, fontWeight: 600 }}>¥{Math.round(total).toLocaleString('zh-CN')}</text>
    </svg>
  );
}

/* 折线图：月度趋势。data = [{ label, value }] */
function LineChart({ data, width = 340, height = 176 }) {
  const pad = { l: 44, r: 14, t: 14, b: 28 };
  const iw = width - pad.l - pad.r;
  const ih = height - pad.t - pad.b;
  const vals = data.map(d => d.value);
  const max = Math.max(...vals, 1);
  const min = 0;
  const x = i => pad.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => pad.t + ih - ((v - min) / (max - min)) * ih;
  const pts = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
  const area = `${pad.l},${pad.t + ih} ${pts} ${x(data.length - 1)},${pad.t + ih}`;
  const ticks = 3;

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   style={{ stopColor: 'var(--chart-main)', stopOpacity: 0.22 }} />
          <stop offset="100%" style={{ stopColor: 'var(--chart-main)', stopOpacity: 0.01 }} />
        </linearGradient>
      </defs>
      {/* 网格线 + Y 轴刻度 */}
      {Array.from({ length: ticks + 1 }, (_, i) => {
        const v = min + ((max - min) / ticks) * i;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={pad.l} y1={yy} x2={width - pad.r} y2={yy} style={{ stroke: 'var(--chart-grid)' }} strokeWidth="1" />
            <text x={pad.l - 8} y={yy + 3.5} textAnchor="end" style={{ fontSize: 9 }} className="fill-slate-400">
              {Math.round(v / 1000)}k
            </text>
          </g>
        );
      })}
      {/* 面积 + 折线（电光青主色） */}
      <polygon points={area} fill="url(#lineFill)" />
      <polyline points={pts} fill="none" style={{ stroke: 'var(--chart-main)' }} strokeWidth="2.5"
                strokeLinecap="round" strokeLinejoin="round" />
      {/* 数据点 + X 轴标签 */}
      {data.map((d, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(d.value)} r="4.5" className="fill-panel" style={{ stroke: 'var(--chart-main)' }} strokeWidth="2.5" />
          <text x={x(i)} y={height - 8} textAnchor="middle" style={{ fontSize: 10 }} className="fill-slate-500">
            {d.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

/* 数据库 category 是中文，映射到品牌色；与 CATEGORIES 保持同一套色值（走主题变量） */
const CAT_COLOR = {
  '餐饮': 'var(--cat1)', '购物': 'var(--cat2)', '娱乐': 'var(--cat3)',
  '交通': 'var(--cat4)', '订阅': 'var(--cat5)', '转账': 'var(--cat6)',
  '转账退回': 'var(--cat-warn)', '收入': 'var(--cat-ok)', '其他': 'var(--cat7)',
};
const catColor = c => CAT_COLOR[c] || 'var(--cat7)';

/* 第 offset 个月的起止日期（offset=0 本月，1 上月…） */
function monthRange(offset = 0) {
  const now = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const first = new Date(now.getFullYear(), now.getMonth() - offset, 1);
  const last  = new Date(now.getFullYear(), now.getMonth() - offset + 1, 0);
  // 本月不取未来日期
  if (offset === 0 && last > now) last.setTime(now.getTime());
  return { start: iso(first), end: iso(last), label: `${first.getMonth() + 1}月` };
}

function BillsPage() {
  const cur = monthRange(0), prev = monthRange(1), prev2 = monthRange(2);
  const [filter, setFilter] = useState({ month: '0', category: '', type: '' });

  /* 本月 / 上月 / 近 3 月：三次请求，环比与趋势都在前端算（后端 /api/transactions 自带 summary） */
  const m0 = useApi(`/api/transactions?start=${cur.start}&end=${cur.end}`, []);
  const m1 = useApi(`/api/transactions?start=${prev.start}&end=${prev.end}`, []);
  const trend = useApi(`/api/transactions?start=${prev2.start}&end=${cur.end}`, []);

  const s0 = m0.data && m0.data.summary;
  const s1 = m1.data && m1.data.summary;
  const totalExpense = s0 ? s0.total_expense : 0;
  const prevExpense  = s1 ? s1.total_expense : 0;
  const delta = prevExpense > 0 ? ((totalExpense - prevExpense) / prevExpense) * 100 : null;

  /* 分类占比（本月支出） */
  const pie = (s0 ? s0.by_category : []).map(c => ({
    name: c.category, value: c.amount, color: catColor(c.category), ratio: c.ratio, count: c.count,
  }));

  /* 近 3 个月趋势：按月份分组汇总支出 */
  const trendData = (() => {
    const txns = (trend.data && trend.data.transactions) || [];
    const buckets = {};
    [prev2, prev, cur].forEach(m => { buckets[m.label] = 0; });
    txns.forEach(t => {
      if (t.type !== 'expense') return;
      const lbl = `${Number(t.date.slice(5, 7))}月`;
      if (lbl in buckets) buckets[lbl] += Number(t.amount);
    });
    return Object.entries(buckets).map(([label, value]) => ({ label, value }));
  })();

  /* 异常提醒：分类环比激增 + 同商户重复扣费，全部由真实数据推导 */
  const anomalies = (() => {
    const out = [];
    if (s0 && s1) {
      const prevCat = {};
      s1.by_category.forEach(c => { prevCat[c.category] = c.amount; });
      s0.by_category.forEach(c => {
        const p = prevCat[c.category] || 0;
        if (p >= 100 && c.amount > p * 1.8) {
          const pct = Math.round(((c.amount - p) / p) * 100);
          out.push({
            id: `cat-${c.category}`,
            text: `${c.category}支出环比 +${pct}%（¥${fmtMoney(p)} → ¥${fmtMoney(c.amount)}）`,
            ask: `${c.category}支出为什么比上月多了这么多？帮我分析一下`,
          });
        }
      });
    }
    /* 同商户本月扣费 ≥ 2 笔 → 疑似重复扣费 */
    const byMerchant = {};
    ((m0.data && m0.data.transactions) || []).forEach(t => {
      if (t.type !== 'expense') return;
      (byMerchant[t.merchant] = byMerchant[t.merchant] || []).push(t);
    });
    Object.entries(byMerchant).forEach(([merchant, list]) => {
      if (list.length >= 2) {
        const sum = list.reduce((s, t) => s + Number(t.amount), 0);
        out.push({
          id: `dup-${merchant}`,
          text: `${merchant}本月被扣费 ${list.length} 笔，合计 ¥${fmtMoney(sum)}，请确认是否重复扣费`,
          ask: `${merchant}这个月扣了我${list.length}次钱，是不是重复扣费了？`,
        });
      }
    });
    return out;
  })();

  /* 流水表：月份 / 分类 / 类型筛选 */
  const selMonth = monthRange(Number(filter.month));
  const txQuery = `/api/transactions?start=${selMonth.start}&end=${selMonth.end}`
    + (filter.category ? `&category=${encodeURIComponent(filter.category)}` : '')
    + (filter.type ? `&type=${filter.type}` : '');
  const tx = useApi(txQuery, [filter.month, filter.category, filter.type]);
  const txRows = (tx.data && tx.data.transactions) || [];
  const allCategories = Array.from(new Set(
    ((trend.data && trend.data.transactions) || []).map(t => t.category)
  ));

  const Select = ({ value, onChange, options, placeholder }) => (
    <div className="relative">
      <select value={value} onChange={e => onChange(e.target.value)}
        className="appearance-none pl-2.5 pr-7 py-1.5 text-[11px] rounded-lg border border-slate-200
                   bg-panel text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-300 transition-all">
        <option value="">{placeholder}</option>
        {options.map(o => <option key={o.v} value={o.v}>{o.t}</option>)}
      </select>
    </div>
  );

  return (
    <PageShell className="space-y-5">
      {/* A4：本页金额为 always 级展示，附敏感提示行 */}
      <SensitiveHint />
      {/* 顶部数字卡三连 */}
      <div className="grid grid-cols-3 gap-4">
        {m0.loading
          ? <div className="col-span-3"><Loading /></div>
          : m0.error
            ? <div className="col-span-3"><ErrBox text={m0.error} /></div>
            : <>
                <StatCard label="本月总支出" value={totalExpense} icon="banknote" tone="amber"
                          sub={`统计区间 ${cur.start} ~ ${cur.end}`} />
                <StatCard label="环比上月" value={prevExpense} icon="trending-up"
                          tone={delta != null && delta >= 0 ? 'rose' : 'emerald'} delta={delta}
                          sub={`上月支出 ¥${fmtMoney(prevExpense)}`} />
                <StatCard label="本月笔数" value={s0 ? s0.count : 0} icon="file-text" tone="blue" raw
                          sub={`其中收入 ¥${fmtMoney(s0 ? s0.total_income : 0)}`} />
              </>}
      </div>

      {/* 中部左右分栏：分类占比 + 月度趋势 */}
      <div className="grid grid-cols-2 gap-4">
        <Panel title="分类占比" icon="pie-chart">
          {m0.loading ? <Loading /> : m0.error ? <ErrBox text={m0.error} />
            : pie.length === 0 ? <Empty text="本月暂无支出记录" />
            : (
              <div className="flex items-center gap-5">
                <DonutChart data={pie} />
                <div className="flex-1 space-y-2 min-w-0">
                  {pie.map(p => (
                    <div key={p.name} className="flex items-center gap-2 text-[11px]">
                      <span className="w-2.5 h-2.5 rounded-sm shrink-0" style={{ background: p.color }} />
                      <span className="text-slate-600 flex-1 truncate">{p.name}</span>
                      <span className="font-mono text-slate-500">¥{fmtMoney(p.value)}</span>
                      <span className="text-slate-400 w-10 text-right">{(p.ratio * 100).toFixed(0)}%</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
        </Panel>

        <Panel title="近 3 个月支出趋势" icon="bar-chart-3">
          {trend.loading ? <Loading /> : trend.error ? <ErrBox text={trend.error} />
            : <LineChart data={trendData} />}
        </Panel>
      </div>

      {/* 异常提醒：红左边框 */}
      <Panel title="异常提醒" icon="alert-triangle"
             right={<span className="text-[11px] text-slate-400">
               {anomalies.length ? `检测到 ${anomalies.length} 项待确认` : '由环比与重复扣费自动识别'}
             </span>}>
        {m0.loading ? <Loading text="正在分析异常…" />
          : anomalies.length === 0
            ? <div className="flex items-center gap-2 py-6 text-xs text-emerald-600">
                本月未发现异常支出，消费节奏正常
              </div>
            : (
              <div className="space-y-2.5">
                {anomalies.map(a => (
                  <div key={a.id}
                    className="flex items-center gap-3 rounded-xl bg-rose-50/60 border-l-[3px] border-rose-500 px-3.5 py-2.5">
                    <span className="flex-1 text-xs text-slate-700">{a.text}</span>
                    <AskBtn text={a.ask} />
                  </div>
                ))}
              </div>
            )}
      </Panel>

      {/* 交易流水表 */}
      <Panel title="交易流水" icon="file-text"
             right={
               <div className="flex items-center gap-2">
                 <Select value={filter.month} onChange={v => setFilter(f => ({ ...f, month: v }))}
                   options={[{ v:'0', t:'本月' }, { v:'1', t:'上月' }, { v:'2', t:'上上月' }]} placeholder="月份" />
                 <Select value={filter.category} onChange={v => setFilter(f => ({ ...f, category: v }))}
                   options={allCategories.map(c => ({ v:c, t:c }))} placeholder="全部分类" />
                 <Select value={filter.type} onChange={v => setFilter(f => ({ ...f, type: v }))}
                   options={[{ v:'expense', t:'仅支出' }, { v:'income', t:'仅收入' }]} placeholder="全部类型" />
               </div>
             }
             bodyClass="">
        {tx.loading ? <Loading /> : tx.error ? <ErrBox text={tx.error} />
          : txRows.length === 0 ? <Empty text="该筛选条件下暂无流水" />
          : (
            <div className="overflow-hidden rounded-xl border border-slate-100">
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-slate-50/80 text-slate-500 text-[11px]">
                    <th className="text-left font-medium px-3.5 py-2">日期</th>
                    <th className="text-left font-medium px-3.5 py-2">分类</th>
                    <th className="text-left font-medium px-3.5 py-2">商户</th>
                    <th className="text-right font-medium px-3.5 py-2.5">金额</th>
                    <th className="text-right font-medium px-3.5 py-2.5 w-24">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {txRows.map(t => {
                    const income = t.type === 'income';
                    /* 跨行清算徽标：在途=清算中（蓝）；退票=退票退回（琥珀）。
                       settle_status='returned' 是原支出流水，category='转账退回' 是退款收入流水，
                       两条都表示"这笔跨行转账被退票"——用户在账单两侧都能一眼认出。 */
                    const settle = t.settle_status === 'pending' ? 'pending'
                      : (t.settle_status === 'returned' || t.category === '转账退回') ? 'returned' : null;
                    return (
                      <tr key={t.id} className="hover:bg-brand-50/40 transition-colors group">
                        <td className="px-3.5 py-2.5 text-slate-400 font-mono whitespace-nowrap">{t.date}</td>
                        <td className="px-3.5 py-2.5">
                          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium"
                                style={{ background: `color-mix(in srgb, ${catColor(t.category)} 12%, transparent)`, color: catColor(t.category) }}>
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: catColor(t.category) }} />
                            {t.category}
                          </span>
                        </td>
                        <td className="px-3.5 py-2.5 text-slate-700 max-w-[240px]">
                          <span className="inline-flex items-center gap-1.5 max-w-full">
                            <span className="truncate">{t.merchant}</span>
                            {settle === 'pending' && (
                              <span className="shrink-0 px-1.5 py-0.5 rounded-full text-[10px] font-medium
                                               bg-sky-50 text-sky-600 border border-sky-200">清算中</span>
                            )}
                            {settle === 'returned' && (
                              <span className="shrink-0 px-1.5 py-0.5 rounded-full text-[10px] font-medium
                                               bg-amber-50 text-amber-700 border border-amber-200">退票退回</span>
                            )}
                          </span>
                        </td>
                        {/* 支出红 / 收入绿 —— 中国股市惯例配色 */}
                        <td className={`px-3.5 py-2.5 text-right font-mono tabular-nums font-medium whitespace-nowrap
                          ${income ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {income ? '+' : '−'}¥{fmtMoney(t.amount)}
                        </td>
                        <td className="px-3.5 py-2.5 text-right">
                          <span className="opacity-0 group-hover:opacity-100 transition-opacity">
                            <AskBtn text={`帮我看看「${t.merchant}」这笔 ${t.amount} 元的${t.category}支出是什么情况`} compact />
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
      </Panel>
    </PageShell>
  );
}
