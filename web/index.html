function App() {
  /* ---------- hash 路由 ---------- */
  const [route, setRoute] = useState(readHash);
  useEffect(() => {
    const onHash = () => setRoute(readHash());
    window.addEventListener('hashchange', onHash);
    if (!window.location.hash) window.location.hash = DEFAULT_ROUTE;
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  /* 审计项 R2：这里原先硬编码了 6 条假对话（含"整体支出比上月多 20%"等与真实数据
     矛盾的断言），后端未就绪时会直接展示并误导用户。改为空数组，
     由后端问候语 / 历史消息填充；后端不可达时走 EmptyState，不再凭空编造。 */
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [balance, setBalance] = useState(0);
  const [logs, setLogs] = useState([]);
  const [confirmStage, setConfirmStage] = useState(null); // pending | confirmed | done_pending | cancelled | done
  const [mode, setMode] = useState('demo');               // demo | real（启动时探测后端）
  const [typing, setTyping] = useState(false);
  /* ★ 连续发多条消息的处理规则（产品要求）：
     - 同一时刻只允许「一轮」在飞（后端对同 thread 也串行化，前端不去并发，避免排队等待被放大）；
     - 在飞期间用户又发的消息 → 进 queuedRef **不提交**，气泡标记「排队中」；
     - 当前轮结束后，只提交排队里的**最后一条**；更早的进 skippedRef（等用户确认再补答）；
     - 补答完且没有新排队项时，用固定话术问一句「是否还要我继续回答上面的问题？」。 */
  const [pendingN, setPendingN] = useState(0);  // 排队条数（仅用于输入区提示渲染）
  const queuedRef = useRef([]);                 // [{id, text}] 排队中，尚未提交
  const skippedRef = useRef([]);                // [{id, text}] 被"最新一条胜出"顶掉，等确认
  const replayRef = useRef([]);                 // [{id, text}] 用户点「继续」后按原顺序补答
  const inFlightRef = useRef(false);            // 是否有请求在飞（与 typing 同步，供 drain 判重）
  /* MCP 外部实时数据（体验层）：由 /api/chat/stream 的 SSE 帧驱动。
     - tool 帧        → 追加「实时」工具胶囊（转圈 loading）
     - tool_result 帧 → 对应胶囊转 ✓（短暂停留后移除），慢调用提示消失
     - status 帧      → 超过 8s 未返回时，对话区上方出现「正在查询外部实时数据…」 */
  const [toolCapsules, setToolCapsules] = useState([]);  // [{id,name,label,status:'loading'|'done',elapsed_s}]
  const [extStatus, setExtStatus] = useState(null);      // 慢调用状态条文案（null = 隐藏）
  /* C4 收件箱：入口未读数（5s 轮询，不用 SSE —— SSE 是对话流专用）+ 抽屉开关 */
  const [unread, setUnread] = useState(0);
  const [unreadTotal, setUnreadTotal] = useState(0);     // 上次读数：用于"新消息短暂高亮"
  const [inboxOpen, setInboxOpen] = useState(false);
  const [inboxFlash, setInboxFlash] = useState(false);
  /* B4：对话流安全验证卡（按 factor 渲染验证码 / 支付密码） */
  const [chatVerify, setChatVerify] = useState(null);
  /* 审计项 M2：thread_id 持久化到 localStorage。
     原先每次加载都重新随机生成 → 刷新后旧会话永远读不回来，旧 thread 变成孤儿。 */
  const [threadId, setThreadId] = useState(() => {
    const saved = localStorage.getItem('xb_thread');
    if (saved) return saved;
    const t = 'web-' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('xb_thread', t);
    return t;
  });
  const [conversations, setConversations] = useState([]);
  const [userName, setUserName] = useState(() => {
    const u = localStorage.getItem('xb_user');
    return u ? (u === 'guest' ? '游客' : u) : '';
  });   // 来自登录页写入的 xb_user（游客显示为"游客"）
  const interactedRef = useRef(false);
  const idRef = useRef(100);
  const nextId = () => ++idRef.current;
  const scrollRef = useRef(null);
  const inputRef = useRef(null);
  /* 已播放完成的流式消息 id 集合：组件实例常驻（App 不卸载），
     切走对话页再回来时凭此跳过重复打字机动画 */
  const streamedRef = useRef(new Set());
  const markStreamed = id => { streamedRef.current.add(id); };

  /* 登录态保护：未登录（无 token）直接回登录页，避免裸进聊天页 / 退不出来 */
  useEffect(() => {
    if (!localStorage.getItem('xb_token')) {
      window.location.href = '/login';
    }
  }, []);

  /* 写操作拦截的引导卡（方式 A：页面按钮被拦 → 就地弹卡，不跳转、不报错红条） */
  const [bindGuide, setBindGuide] = useState(false);
  useEffect(() => onBindGuide(() => setBindGuide(true)), []);
  /* 收件箱总线：任何组件（如手机绑定卡）都能唤起右上角抽屉 */
  useEffect(() => onOpenInboxEvt(() => setInboxOpen(true)), []);

  /* 即时预填：同页（对话页内）点击快捷指令 → 立即填入输入框并聚焦 */
  useEffect(() => {
    const onNow = (e) => {
      _prefill = null;
      const text = String(e.detail || '');
      if (!text) return;
      setInput(text);
      setTimeout(() => {
        const el = inputRef.current;
        if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) {} }
      }, 60);
    };
    window.addEventListener('xb:prefill-now', onNow);
    return () => window.removeEventListener('xb:prefill-now', onNow);
  }, []);

  /* 跨页预填：其他页面跳来时把指令填入输入框并聚焦（不自动发送，等用户回车确认） */
  useEffect(() => {
    if (_prefill) {
      const text = _prefill;
      _prefill = null;
      setInput(text);
      setRoute('/chat');
      if (window.location.hash !== '#/chat') window.location.hash = '/chat';
      setTimeout(() => {
        const el = inputRef.current;
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 80);
    }
    /* 转账页办完回对话：消费重拉标记，把这笔转账的留痕拉进对话历史 */
    if (consumeChatReload() && route === '/chat') {
      loadHistory(threadId);
    }
  }, [route]);

  /* 新消息到达时自动滚到底部 */
  useEffect(() => {
    const el = scrollRef.current;
    el && el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  }, [messages]);

  const addLog = (op, result) => setLogs(ls => [...ls, { time: nowTime(), op, result }]);
  const addMessage = m => setMessages(ms => [...ms, { id: nextId(), ...m }]);
  /* 收尾/切换会话时清掉 MCP 工具胶囊与慢调用提示，避免残留影响下一条消息 */
  const clearExtUi = () => { setToolCapsules([]); setExtStatus(null); };

  /* ---------- ★ 连续发多条消息：排队 / 只答最后一条 / 询问是否继续 ---------- */

  /* 真正提交一条问题（用户气泡已渲染，这里只把「排队中」标记抹掉并发出去） */
  const submitQuestion = (item) => {
    if (item && item.id) setMessages(ms => ms.map(m => (m.id === item.id ? { ...m, queued: false } : m)));
    inFlightRef.current = true;
    if (mode === 'real') realSend(item.text);
    else demoReply(item.text);
  };

  /* 内联提交（验证码 / 支付密码等没有用户气泡的消息）：属于挂起流程的应答，
     必须立刻发出，不参与排队规则；但同样要登记 inFlight，避免与排队调度打架。 */
  const dispatchInline = (text) => {
    inFlightRef.current = true;
    if (mode === 'real') realSend(text);
    else demoReply(text);
  };

  /* 收口话术（★固定文案，不列出被跳过问题的具体内容）；幂等：末条已是该卡就不再追加 */
  const askContinueSkipped = () => {
    if (!skippedRef.current.length) return;
    setMessages(ms => {
      const last = ms[ms.length - 1];
      if (last && last.role === 'ask_more') return ms;
      return [...ms, { id: nextId(), role: 'ask_more' }];
    });
  };

  /* 一轮结束后的调度：排队（只取最后一条）> 顺序补答 > 询问是否继续 */
  const drainRound = () => {
    if (inFlightRef.current) return;              // 已有请求在飞 → 等它结束
    if (queuedRef.current.length) {
      const q = queuedRef.current;
      const last = q[q.length - 1];
      const dropped = q.slice(0, -1);             // 被「最新一条胜出」顶掉的
      queuedRef.current = [];
      setPendingN(0);
      if (dropped.length) skippedRef.current = [...skippedRef.current, ...dropped];
      submitQuestion(last);
      return;
    }
    if (replayRef.current.length) { submitQuestion(replayRef.current.shift()); return; }
    if (skippedRef.current.length) askContinueSkipped();
  };

  /* ★ 唯一「一轮结束」信号：typing 落回 false。所有收尾路径（成功/报错/超时/演示）
     最终都会 setTyping(false)，所以这里能统一接管后续调度，不必改十几个调用点。 */
  useEffect(() => {
    if (typing) { inFlightRef.current = true; return; }
    inFlightRef.current = false;
    drainRound();
  }, [typing]);

  /* 收口卡交互：继续 → 按原顺序补答；不用了 → 直接丢弃 */
  const onAskMoreContinue = () => {
    const items = skippedRef.current;
    skippedRef.current = [];
    setMessages(ms => ms.filter(m => m.role !== 'ask_more'));
    if (!items.length) return;
    replayRef.current = [...replayRef.current, ...items];
    drainRound();
  };
  const onAskMoreSkip = () => {
    skippedRef.current = [];
    setMessages(ms => ms.filter(m => m.role !== 'ask_more'));
  };

  /* 清空排队/待补答（新会话、切换会话时用） */
  const resetQueue = () => {
    queuedRef.current = [];
    skippedRef.current = [];
    replayRef.current = [];
    inFlightRef.current = false;
    setPendingN(0);
  };

  /* ============================================================
     「与小微对话」：语音对话闭环
       聆听 → 静音自动收口 → 自动发送（内容照常进聊天区）→ 小微语音+口型回答
       → 估算播报时长（期间关麦防自听）→ 自动回到聆听；随时可「打断」。
     ★ 识别器全页唯一，由这里持有并下传给 ChatInput（避免两个实例互抢）。
     ============================================================ */
  /* ★ 打断后的「余音衰减期」（毫秒）：从"发出停止指令"到"扬声器真正静下来"
     还有一截尾巴（Fay 已缓冲的音频 + 音箱余响）。这段时间内识别到的
     几乎全是数字人自己的声音，一律丢弃，避免串进用户输入。 */
  const VD_ECHO_GUARD_MS = 700;
  const [vdOn, setVdOn] = useState(() => localStorage.getItem('xb_voice_dialog') === '1');
  const [vdState, setVdState] = useState('idle');   // idle | listening | thinking | speaking
  const vdPhaseRef = useRef('idle');                // 权威阶段（用 ref 防 effect 重跑抖动）
  const vdUtterRef = useRef('');                    // 本轮已确认的识别文本
  const vdLastAtRef = useRef(0);                    // 最近一次识别结果时间 → 静音判定
  const vdSpeakTimerRef = useRef(null);
  const vdTickRef = useRef(null);       // 「约剩几秒」的一秒一跳
  const sendTextRef = useRef(null);
  const speechRef = useRef(null);
  const vdApiRef = useRef({});
  /* ★ 自听过滤（修「它把自己说的话当成了我说的话」）：
     记住刚播报的原文 + 播报时刻；随后若识别结果与它高度重合 → 判定为麦克风听到数字人自己，丢弃。 */
  const vdSpokeRef = useRef('');        // 刚播报的原文（done.payload.reply）
  /* ★ 最近几条播报原文（已去标点）。ASR 对同一段语音常给出不同错字版本，
     只比对「最后一条」容易漏；多留几条 + 最长公共子串比对才稳。 */
  const vdSpokenPoolRef = useRef([]);
  const vdSpokeAtRef = useRef(0);       // 开始播报的时刻
  const vdListenAtRef = useRef(0);      // 本次麦克风重开时刻（自听过滤的时间基准）
  const vdSpeakMsRef = useRef(0);       // 后端算出的播报时长（毫秒，兜底用）
  /* ★ 自听过滤的**绝对截止时刻**（两种模式统一；0 = 不过滤）。
     语音对话模式由「重开麦」起算，普通模式没有该事件，只能由「本轮播报预计结束」起算。 */
  const vdEchoUntilRef = useRef(0);
  /* ★ 打断后的余音衰减截止时刻（见 VD_ECHO_GUARD_MS）：此窗口内识别结果一律丢弃。 */
  const vdMuteUntilRef = useRef(0);
  const vdWsRef = useRef(null);         // 旁听 Fay 驱动 WS 的连接
  const vdAudioStartRef = useRef(0);    // 本轮第一帧音频到达时刻
  const vdAudioTotalRef = useRef(0);    // 本轮已到达音频帧的时长累计（毫秒）
  const [vdEcho, setVdEcho] = useState(0);   // 本次会话被丢弃的自听条数（>0 时提示用户）
  const [vdLeft, setVdLeft] = useState(0);   // 播报预计剩余秒数（实测音频时长驱动，显示给用户）

  const vdSetPhase = (p) => { vdPhaseRef.current = p; setVdState(p); };
  const vdClearSpeakTimer = () => {
    if (vdSpeakTimerRef.current) { clearTimeout(vdSpeakTimerRef.current); vdSpeakTimerRef.current = null; }
    if (vdTickRef.current) { clearInterval(vdTickRef.current); vdTickRef.current = null; }
  };

  /* 统一挂表：ms 后结束播报阶段。同时把"约剩几秒"做成真的一秒一跳显示在状态条上
     —— 既让用户有预期，也让这套计时可观察可排查。 */
  const vdArmTimer = (ms) => {
    vdClearSpeakTimer();
    const left = Math.max(300, Math.round(ms));
    const endsAt = Date.now() + left;
    setVdLeft(Math.round(left / 1000));
    vdTickRef.current = setInterval(() => {
      const s = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      setVdLeft(s);
      if (s <= 0 && vdTickRef.current) { clearInterval(vdTickRef.current); vdTickRef.current = null; }
    }, 1000);
    vdSpeakTimerRef.current = setTimeout(() => {
      vdSpeakTimerRef.current = null;
      setVdLeft(0);
      if (vdPhaseRef.current === 'speaking') vdApiRef.current.finishSpeak();
    }, left);
  };

  /* 播报时长估算：中文 TTS 约 4~4.5 字/秒 + 起播尾巴；45s 兜底 */
  const vdEstimateMs = (text) => {
    const n = String(text || '').replace(/\s/g, '').length;
    return Math.min(45000, Math.max(2200, Math.round(n * 230) + 1200));
  };

  /* 最长公共子串长度：对 ASR 错字最鲁棒 —— 整句包含会因开头一串鬼话而失配，
     字符命中率又会被长播报文本稀释。长度限 300 字符内，DP 开销可忽略。 */
  const vdLcsLen = (x, y) => {
    const n = Math.min(x.length, 300), m = Math.min(y.length, 300);
    if (!n || !m) return 0;
    let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1), best = 0;
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        cur[j] = x[i - 1] === y[j - 1] ? prev[j - 1] + 1 : 0;
        if (cur[j] > best) best = cur[j];
      }
      const t = prev; prev = cur; cur = t; cur.fill(0);
    }
    return best;
  };

  /* 记住本轮播报原文（供自听过滤比对）；保留最近 3 条 */
  const vdRememberSpoken = (text) => {
    const raw = String(text || '');
    if (!raw.trim()) return;
    vdSpokeRef.current = raw;
    /* ★ 起算自听过滤窗口（仅当数字人真的在播报）：播报预计结束 + 3s 尾巴。
       普通模式没有「重开麦」事件，只能在这里起算；
       数字人关闭时不设窗口 —— 否则会把"和上一条回复相似的用户原话"误判成自听。 */
    if (localStorage.getItem('xb_digital_human') === '1') {
      vdEchoUntilRef.current = Date.now() + (vdSpeakMsRef.current || vdEstimateMs(raw)) + 3000;
    }
    const s = raw.replace(/[\s\p{P}\p{S}]/gu, '');
    if (!s) return;
    vdSpokenPoolRef.current = [s, ...(vdSpokenPoolRef.current || [])].slice(0, 3);
  };

  /* 自听判定：识别结果是否"像是数字人刚说过的话"。
     ★ 时间窗必须从**麦克风重开**算起（不是从开始播报算）——
       否则长回复播完后早已超过窗口，过滤会失效（本机踩过）。
     ★ 判定手段（2026-09-20 加固）：实测漏进过
       「漂流记不到哪里就有东西，请先通过新增收款人完成账户验证后转账」这种
       **开头一串鬼话 + 后半段与原话一致**的回灌 —— 旧的「整句包含」直接失配，
       「字符命中率」又被长文本稀释，于是被当成用户提问送进了对话。
       现在以**最长公共子串**为主判据，并与最近 3 条播报文本逐一比对。 */
  const vdLooksLikeEcho = (text) => {
    const a = String(text || '').replace(/[\s\p{P}\p{S}]/gu, '');
    if (a.length < 6) return false;                                   // 太短不做判定（可能是真实简短指令）
    /* 时间窗用**绝对截止时刻**（两种模式统一）：超出就不再过滤，避免误伤用户原话。 */
    if (!vdEchoUntilRef.current || Date.now() > vdEchoUntilRef.current) return false;
    const pool = (vdSpokenPoolRef.current || []).filter(Boolean);
    if (!pool.length) return false;
    for (const b of pool) {
      if (b.includes(a)) return true;                                 // 整句都在播报过的话里
      const lcs = vdLcsLen(a, b);
      if (lcs >= 12) return true;                                     // 与播报内容有长片段重合
      if (lcs >= 6 && lcs / a.length >= 0.6) return true;             // 短句但大半来自播报
      if (a.length >= 12) {                                           // 兜底：字符命中率（仅长文本用）
        const setB = new Set(b);
        let hit = 0;
        for (const ch of a) if (setB.has(ch)) hit++;
        if (hit / a.length >= 0.92) return true;
      }
    }
    return false;
  };

  /* 识别结果：普通模式只追加进输入框；对话模式累积回显 + 打时间戳供静音判定 */
  const speech = useSpeechInput((t) => {
    vdLastAtRef.current = Date.now();
    /* ★ 打断后的余音衰减期：停止指令已发出，但音箱里剩下的还是它自己的声音。
       这几百毫秒内识别到的内容一律丢弃（不进输入框、不发请求）。 */
    if (Date.now() < vdMuteUntilRef.current) { setVdEcho((n) => n + 1); return; }
    if (!vdOn) {
      /* ★ 普通模式同样要防自听：数字人念回复时开麦，会把它的声音识别成"我说的话"
         直接写进输入框（此前这里完全没过滤）。判定条件很严（长公共子串 + 时间窗），
         不会误伤用户原话。丢弃时给一句瞬时提示，避免"说了没反应"的困惑。 */
      if (vdLooksLikeEcho(t)) {
        setVdEcho((n) => n + 1);
        if (speechRef.current) speechRef.current.flash('已忽略一句（听上去像小微自己的声音）');
        return;
      }
      setInput((prev) => (prev || '') + t);
      return;
    }
    if (vdPhaseRef.current !== 'listening') return;                    // 不在聆听阶段 → 一律忽略
    if (vdLooksLikeEcho(t)) {                                          // 自听 → 丢弃，绝不发送
      setVdEcho((n) => n + 1);
      return;
    }
    vdUtterRef.current += t;
    setInput(vdUtterRef.current);
  });
  speechRef.current = speech;

  /* 进入聆听（顺带清掉上一轮残留） */
  const vdListen = () => {
    vdClearSpeakTimer();
    vdUtterRef.current = '';
    vdLastAtRef.current = 0;
    vdAudioStartRef.current = 0;
    vdAudioTotalRef.current = 0;
    setVdEcho(0);
    setVdLeft(0);
    vdListenAtRef.current = Date.now();      // 自听过滤的时间基准：从"重开麦"算起
    vdEchoUntilRef.current = Date.now() + 25000;   // 语音模式：重开麦后 25s 内仍可能听到余音
    setInput('');
    vdSetPhase('listening');
    if (speechRef.current) speechRef.current.start();
  };

  /* 收口：把本轮说的话发出去（手动点麦克风，或静音自动触发；无内容则忽略） */
  const vdCommit = () => {
    if (vdPhaseRef.current !== 'listening') return;
    const text = vdUtterRef.current.trim();
    if (!text) return;
    vdUtterRef.current = '';
    vdLastAtRef.current = 0;
    vdAudioStartRef.current = 0;      // 新一轮播报，音频计时清零
    vdAudioTotalRef.current = 0;
    if (speechRef.current) speechRef.current.stop();
    vdSetPhase('thinking');
    if (sendTextRef.current) sendTextRef.current(text);
  };

  /* 打断：停播报 + 立刻回到聆听。
     ★ 打断要三件事一起做，缺一件就会"它还在念 / 把自己的声音录进去"：
       ① 后端停 Fay 播报，并置位「闭嘴」（否则在途的 done 帧到了会停下又念一遍）
       ② 前端开一道余音衰减期（见 VD_ECHO_GUARD_MS），期内识别结果一律丢弃
       ③ 立刻回到聆听，让用户能马上说话 */
  const vdInterrupt = () => {
    vdClearSpeakTimer();
    vdSetPhase('idle');
    vdMuteUntilRef.current = Date.now() + VD_ECHO_GUARD_MS;
    fetch('/api/digital-human/interrupt', { method: 'POST', headers: authHeaders() })
      .then((r) => r.json().catch(() => null))
      .then((d) => {
        // 没送到（Fay 未启动 / 丢包）→ 它还会在念，把丢弃窗口拉长，别把余音当人话
        if (d && d.delivered === false) vdMuteUntilRef.current = Date.now() + 3000;
      })
      .catch(() => {});
    vdListen();
  };

  /* 开关：写 localStorage + 广播（用户菜单 / 数字人面板共用同一套状态） */
  const vdToggle = () => {
    const next = localStorage.getItem('xb_voice_dialog') === '1' ? '0' : '1';
    localStorage.setItem('xb_voice_dialog', next);
    if (next === '1') {
      localStorage.setItem('xb_digital_human', '1');     // 对话模式需要"虚拟人说话"这一环
      window.dispatchEvent(new Event('xb-dh-toggle'));
    }
    window.dispatchEvent(new Event('xb-vd-toggle'));
    setVdOn(next === '1');
  };

  vdApiRef.current = {
    listen: vdListen, commit: vdCommit, interrupt: vdInterrupt, toggle: vdToggle,
    finishSpeak: () => { if (vdPhaseRef.current === 'speaking') vdListen(); },
  };

  /* ★ 实测播报时长：旁听 Fay 驱动 WS（10002），按真实音频帧的 Time 累加决定何时重开麦克风。
     —— 按文本估时长实测偏差可达 40%（长回复会顶到 60s 上限，实际只说 36s），
        故只要有帧就以帧为准：每来一帧就把"结束时刻"重排为 首帧时刻 + ΣTime + 0.7s。
        Fay 按 username 群发给同名客户端，Live2D 页面与本页面各连一条、互不影响。 */
  useEffect(() => {
    if (!vdOn) {
      if (vdWsRef.current) { try { vdWsRef.current.close(); } catch (e) {} vdWsRef.current = null; }
      return undefined;
    }
    let closed = false;
    const arm = () => {
      const want = vdAudioStartRef.current + vdAudioTotalRef.current + 700 - Date.now();
      if (vdPhaseRef.current === 'speaking') vdArmTimer(want);
    };
    const connect = (url, user) => {
      let ws;
      try { ws = new WebSocket(url); } catch (e) { return null; }
      ws.onopen = () => { try { ws.send(JSON.stringify({ Username: user, Output: true })); } catch (e) {} };
      ws.onmessage = (e) => {
        let d;
        try { d = JSON.parse(e.data); } catch (err) { return; }
        if (!d || d.Topic !== 'human') return;
        const data = d.Data || {};
        if (data.Key !== 'audio') return;                 // text 帧不带口型/时长，忽略
        const now = Date.now();
        if (!vdAudioStartRef.current) vdAudioStartRef.current = now;
        vdAudioTotalRef.current += Math.max(0, Number(data.Time) || 0) * 1000;
        vdSpokeAtRef.current = vdAudioStartRef.current;   // 自听过滤的时间基准
        if (vdPhaseRef.current === 'speaking') arm();
      };
      ws.onerror = () => {};
      return ws;
    };
    fetch('/api/digital-human/status', { headers: authHeaders() })
      .then((r) => r.json())
      .then((d) => {
        if (closed || !d || !d.ws_url) return;
        vdWsRef.current = connect(d.ws_url, d.username || 'User');
      })
      .catch(() => {});
    return () => {
      closed = true;
      if (vdWsRef.current) { try { vdWsRef.current.close(); } catch (e) {} vdWsRef.current = null; }
    };
  }, [vdOn]);

  /* 开关状态跟随广播（用户菜单也能切） */
  useEffect(() => {
    const sync = () => setVdOn(localStorage.getItem('xb_voice_dialog') === '1');
    window.addEventListener('xb-vd-toggle', sync);
    return () => window.removeEventListener('xb-vd-toggle', sync);
  }, []);

  /* 开关变化 → 起停状态机 */
  useEffect(() => {
    if (vdOn) {
      vdApiRef.current.listen();
    } else {
      vdClearSpeakTimer();
      vdSetPhase('idle');
      vdUtterRef.current = '';
      if (speechRef.current) speechRef.current.stop();
    }
    return undefined;
  }, [vdOn]);

  /* 静音收口：聆听中已有内容且停顿 > 1.3s → 视为说完，自动发送 */
  useEffect(() => {
    if (!vdOn) return undefined;
    const id = setInterval(() => {
      if (vdPhaseRef.current !== 'listening') return;
      if (!vdUtterRef.current.trim()) return;
      if (Date.now() - vdLastAtRef.current < 1300) return;
      vdApiRef.current.commit();
    }, 300);
    return () => clearInterval(id);
  }, [vdOn]);

  /* 回复生成完毕（typing 落回 false）→ 关麦等它说完（优先用实测音频时长），播完自动回到聆听 */
  useEffect(() => {
    if (!vdOn || typing) return undefined;
    if (vdPhaseRef.current !== 'thinking') return undefined;
    const last = [...messages].reverse().find((m) => m.role === 'assistant');
    const text = (last && last.text) || '';
    if (!vdSpokeRef.current) vdRememberSpoken(text);       // 非流式/演示模式的兜底
    vdSpokeAtRef.current = Date.now();
    /* ★ 优先用**旁听到的真实音频时长**：Fay 往往在我们进入 speaking 之前就把音频帧推完了，
       故这里要主动读一次已累计的 ΣTime；speaking 期间才到的帧由 observer 的 arm() 继续顺延。
       拿不到帧（没真在播报）才回落到文本估算。 */
    const audioTotal = vdAudioTotalRef.current;
    const contentDur = Math.max(audioTotal, vdSpeakMsRef.current || 0, vdEstimateMs(text));
    const measured = (vdAudioStartRef.current && audioTotal > 0)
      ? vdAudioStartRef.current + audioTotal + 700 - Date.now()
      : 0;
    /* ★ 计时兜底（修「小微听到自己的声音」）：若按帧推算「已经播完」（measured ≤ 0），
       说明音频帧在进入 speaking 之前就推完了 —— 此时**绝不能**只等 300ms 就开麦，
       否则麦克风会在它还在说话时打开、把尾音当用户提问（实测漏进过一条幻听提问）。
       改为从此刻起按内容时长重新计时：宁可晚开一点，也不能收录它自己的声音。 */
    const ms = measured > 500 ? measured : Math.min(60000, contentDur + 800);
    vdSpeakMsRef.current = 0;                               // 用掉即清，避免影响下一轮
    vdSetPhase('speaking');
    vdArmTimer(ms);
    return undefined;
  }, [typing, vdOn, messages]);

  /* 卸载：释放麦克风与定时器 */
  useEffect(() => () => {
    vdClearSpeakTimer();
    if (speechRef.current) speechRef.current.stop();
  }, []);

  /* 下传给 ChatInput / VoiceDialogBar / DigitalHumanPanel */
  const vd = {
    on: vdOn, state: vdState, echo: vdEcho, left: vdLeft,
    toggle: vdToggle, commit: vdCommit, interrupt: vdInterrupt, restart: vdListen,
  };

  /* 助手回复：先「正在输入」，再替换为流式打字消息 */
  const assistantSay = (text, card, delay = 900) => {
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      addMessage({ role: 'assistant', text, card, stream: true });
    }, delay);
  };

  /* 转账演示流：确认卡 → 收件箱验证提示 → 成功回执（离线演示不产生真实验证码） */
  const startTransfer = () => {
    if (confirmStage && confirmStage !== 'cancelled' && confirmStage !== 'done') return;
    setConfirmStage('pending');
    addLog('发起转账 ¥2,000.00', '风控预检');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      addMessage({ role: 'assistant', text: '已为您生成转账确认单。小微已完成实时风控预检，请核对以下信息后确认执行。', stream: true });
      addMessage({ role: 'confirm' });
    }, 900);
  };

  const handleConfirm = () => {
    setConfirmStage('confirmed');
    setTyping(true);
    setTimeout(() => {
      setConfirmStage('done_pending');
      addMessage({ role: 'system', text: '检测到向新收款人转账，已触发二次验证。真实模式下验证码将发送至您的收件箱（右上角打开）。' });
      addLog('二次验证 · 安全验证', '已发送');
    }, 900);
    setTimeout(() => {
      setTyping(false);
      setConfirmStage('done');
      addMessage({ role: 'assistant', text: '验证通过，转账已完成！电子回执如下，资金已实时到账。', card: 'receipt' });
      setBalance(b => b - PLACEHOLDER.confirm.amount);
      addLog('转账 ¥2,000.00 → 妈妈（6688）', '成功');
    }, 3600);
  };

  const handleCancel = () => {
    setConfirmStage('cancelled');
    addLog('转账 ¥2,000.00', '已取消');
    assistantSay('好的，已为您取消该笔转账，资金未发生任何变动。还有其他需要吗？');
  };

  /* ================= 演示模式（静态占位流，与真实模式同构） ================= */
  const demoReply = (text) => {
    // 审计项 R6：离线演示不再编造业务结论（余额数字 / 支出环比等），
    // 只演示交互流程本身；页面顶部已有「离线演示模式」系统提示。
    if (/转账|转给|汇款|打钱/.test(text)) startTransfer();
    else if (/余额|多少钱/.test(text)) assistantSay('（示例流程）连接银行服务后，这里会展示您的真实账户余额。当前为离线演示，不展示虚构数字。', 'balance');
    else if (/账单|分析|消费|花/.test(text)) assistantSay('（示例流程）账单分析需要连接银行服务后，基于真实流水生成结论。当前为离线演示，不提供虚构的支出分析。', 'chart');
    else if (/订阅|理财|任务/.test(text)) assistantSay('（示例流程）任务链执行进度如上方所示。连接银行服务后，这里会展示真实的订阅与理财操作结果。', 'task');
    else assistantSay('当前为离线演示模式，仅支持有限的示例指令。请启动 bank-agent 后端并刷新页面，即可体验完整的真实业务流程～');
  };

  /* ================= 真实模式（连后端 Agent） ================= */

  /* C4：未读数轮询（5s）。有新消息 → 入口文字短暂高亮 2s */
  const refreshUnread = () => fetch('/api/inbox/unread_count', { headers: authHeaders() })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      const n = Number(d.count) || 0;
      setUnread(prev => {
        if (n > prev) {
          setInboxFlash(true);
          setTimeout(() => setInboxFlash(false), 2000);
        }
        return n;
      });
      setUnreadTotal(n);
    }).catch(() => {});

  useEffect(() => {
    refreshUnread();
    const id = setInterval(refreshUnread, 5000);   // ★轮询而非 SSE：对话流专用通道不混用
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* 从 /api/state 同真实操作日志；金额字段默认脱敏（A1：初始请求无真值） */
  const refreshState = () => fetch('/api/state').then(r => r.json()).then(s => {
    if (s.balance != null) setBalance(s.balance);
    if (s.logs && s.logs.length) setLogs(s.logs);
  }).catch(() => {});

  /* ------------------------------------------------------------------
     会话列表 / 历史回读（审计项 M2）
     此前会话只活在 React 内存里，刷新即丢且无列表；现在落地到 MySQL 的
     conversations + chat_messages，支持切换 / 新建 / 删除。
     ------------------------------------------------------------------ */
  const applyThreadId = (tid) => {
    localStorage.setItem('xb_thread', tid);
    setThreadId(tid);
  };

  const refreshConversations = () =>
    fetch('/api/conversations', { headers: authHeaders() }).then(r => r.json())
      .then(d => { if (d.ok) setConversations(d.conversations || []); })
      .catch(() => {});

  /* 回读历史。历史消息不带 stream，直接渲染 Markdown —— 否则刷新后会重播打字机 */
  const loadHistory = (tid) =>
    fetch(`/api/conversations/${encodeURIComponent(tid)}/messages`, { headers: authHeaders() }).then(r => r.json())
      .then(d => {
        const list = (d.ok && d.messages) || [];
        setMessages(list.map(m => ({ id: nextId(), role: m.role, text: m.text })));
        return list.length;
      })
      .catch(() => 0);

  /* 个性化问候语：新会话首次从后端拉取并作为首条 AI 消息（带打字机）；
     后端失败时回落到通用问候，保证对话页始终有开场白。 */
  const showGreeting = async (tid) => {
    try {
      const r = await fetch(`/api/conversations/${encodeURIComponent(tid)}/greeting`, { headers: authHeaders() });
      const d = await r.json().catch(() => ({}));
      if (d.ok && d.greeting) {
        setMessages([{ id: nextId(), role: 'assistant', stream: true, text: d.greeting }]);
        return;
      }
    } catch (e) { /* 忽略，走兜底 */ }
    setMessages([{ id: nextId(), role: 'assistant', stream: true,
      text: '您好，我是小微，您的 AI 银行助手（已接入真实账户）。可以直接告诉我需求，例如：这个月钱花哪了 / 给妈妈转2000 / 把不用的订阅取消，省下的钱买理财。' }]);
  };

  /* 启动探测：后端可达 → 真实模式。
     先回读历史：有历史则恢复现场，无历史（新会话）才显示问候语。 */
  useEffect(() => {
    let cancelled = false;
    fetch('/api/state').then(r => r.json()).then(async () => {
      if (cancelled) return;
      setMode('real');
      refreshState();
      refreshConversations();
      if (!interactedRef.current) {
        const n = await loadHistory(threadId);
        if (cancelled) return;
        if (n === 0) showGreeting(threadId);
      }
    }).catch(() => {
      // 探测失败 → 离线演示模式
      // 审计项 R4/R6：原先这里会 setBalance(PLACEHOLDER.initialBalance) 塞一个
      // 与真实账户（¥50,000）完全不符的 ¥132,514.82，并伪造三条操作日志。
      // 改为不编造数字 + 明确告知处于离线演示态，避免把占位数据当成真实账户。
      if (cancelled) return;
      addMessage({
        role: 'system',
        text: '银行服务未连接，当前为离线演示模式。页面数据与下方快捷指令的回复均为示例内容，不代表您的真实账户。',
      });
    });
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* 把后端返回结构渲染进消息流 —— POST /api/chat 与 SSE done 帧共用同一渲染逻辑 */
  const renderChatPayload = (data) => {
    if (!data) return;
    if (data.kind === 'confirm') {
      const id = nextId();
      setMessages(ms => [...ms,
        { id, role: 'assistant', text: '请核对以下操作信息。' },
        { id: id + 1, role: 'confirm', fields: data.fields, amount: data.amount, stage: 'pending' }]);
    } else if (data.kind === 'verify') {
      const id = nextId();
      setMessages(ms => [...ms, { id, role: 'system', text: data.reply }]);
      /* B4：记录 verify 类型字段，渲染对应卡片（验证码 / 密码绝不搞混） */
      setChatVerify({ factor: data.factor || data.verify, need_set: data.need_set, queue: data.queue || [] });
    } else {
      setChatVerify(null);   // 终态：清掉挂起的验证卡
      const id = nextId();
      // data.nav：后端优先返回 LLM 的 navigate_to 结构化意图（nav.auto=自动跳转），
      // 回落到关键词 _detect_nav（需点一下）。前端关键词 detectNavIntent 已在发送时作零延迟兜底。
      const nav = data.nav || null;
      setMessages(ms => [...ms, { id, role: 'assistant', text: data.reply || '', stream: true, nav }]);
      // LLM 结构化导航（nav.auto）→ 收到即自动跳转，不必点；用 location.hash 比对，避免闭包拿到旧 route
      if (nav && nav.auto && window.location.hash.replace(/^#/, '') !== nav.to) navigate(nav.to);
      // 「帮我转账」信息不全 → 后端给 suggest 标记，渲染「前往转账页」引导卡（与对话内补齐双路径）
      if (data.suggest === 'transfer_page') {
        const gid = nextId();
        setMessages(ms => [...ms, { id: gid, role: 'suggest_transfer', text: data.reply || '' }]);
      }
      // 方式 B：写操作被「未绑定手机号」拦截 → 对话里渲染「去绑定手机」引导卡
      if (data.suggest === 'bind_phone') {
        const bid = nextId();
        setMessages(ms => [...ms, { id: bid, role: 'suggest_bind_phone', text: data.reply || '' }]);
      }
    }
    refreshState();
    refreshConversations();   // 首条用户消息会触发会话自动命名，列表需同步
  };

  /* SSE 帧分发。返回 true = 终帧（done / error），调用方停止读取并收尾 */
  const handleStreamEvent = (ev) => {
    if (!ev || !ev.type) return false;
    switch (ev.type) {
      case 'tool': {   // MCP 外部工具开始：追加「实时」胶囊（转圈）
        const cap = { id: ev.id || ev.name, name: ev.name, label: ev.label || ev.name, status: 'loading' };
        setToolCapsules(cs => (cs.some(c => c.id === cap.id) ? cs : [...cs, cap]));
        return false;
      }
      case 'status':   // 超过 8s 未返回：对话区上方慢调用提示
        setExtStatus(ev.text || '正在查询外部实时数据，约需数秒…');
        return false;
      case 'tool_result': {  // 工具返回：胶囊转圈 → ✓，短暂停留后移除；慢调用提示消失
        setExtStatus(null);
        const capId = ev.id || ev.name;
        setToolCapsules(cs => cs.map(c => (c.id === capId ? { ...c, status: 'done', elapsed_s: ev.elapsed_s } : c)));
        setTimeout(() => setToolCapsules(cs => cs.filter(c => c.id !== capId)), 1200);
        return false;
      }
      case 'done': {   // 终帧：payload 与 POST /api/chat 返回结构完全一致
        clearExtUi();
        // 「与小微对话」：记住后端按**实际朗读文本**估算的播报时长（0 = 后端未给，前端回落到本地估算）
        vdSpeakMsRef.current = (ev.payload && ev.payload.dh_speak_ms) || 0;
        vdRememberSpoken((ev.payload && ev.payload.reply) || '');   // 同时进自听比对的「最近播报」池
        renderChatPayload(ev.payload);
        return true;
      }
      case 'error':    // 运行异常（对应 POST 的 HTTP 500 语义）
        clearExtUi();
        addMessage({ role: 'system', text: '后端调用失败：' + (ev.detail || '未知错误') });
        return true;
      default:
        return false;
    }
  };

  /* 真实模式发送：优先 POST /api/chat/stream（SSE 事件流，可实时展示 MCP 工具胶囊）。
     流端点缺位 / 网络不可达时自动兜底 POST /api/chat（原协议原样保留，行为不变）。
     kind = text | confirm | verify，由后端解析 interrupt 文本得出 */
  const realSend = async (text) => {
    setTyping(true);
    let sseAccepted = false;    // 已拿到流式响应体（进入事件读取循环）
    // ★ 看门狗：后端每 ~1s 会推一帧保活（`: keepalive`），所以「长时间一个字节都收不到」
    //   只可能是链路真死了。到点主动 abort，把「无限转圈」变成一条明确报错。
    const ctrl = new AbortController();
    let wd = null;
    let wdTimedOut = false;
    let lastDataAt = Date.now();
    const WD_MS = 120000;       // 2 分钟无任何数据 → 判定超时（健康流有保活帧，不会误杀）
    try {
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        signal: ctrl.signal,
        headers: authHeaders({
          'Content-Type': 'application/json',
          'X-Digital-Human': localStorage.getItem('xb_digital_human') === '1' ? '1' : '0',
        }),
        body: JSON.stringify({ thread_id: threadId, message: text }),
      });
      if (!res.ok) {
        // 老版本服务端没有 /api/chat/stream → 抛错走 POST 兜底；其余错误如实展示
        if (res.status === 404 || res.status === 405) throw new Error('stream-endpoint-missing');
        const data = await res.json().catch(() => ({}));
        setTyping(false);
        addMessage({ role: 'system', text: '后端调用失败：' + (data.detail || ('HTTP ' + res.status)) });
        return;
      }
      if (!res.body) throw new Error('no-stream-body');   // 非流式响应 → POST 兜底
      sseAccepted = true;

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      let gotAnyFrame = false;
      wd = setInterval(() => {
        if (Date.now() - lastDataAt > WD_MS) { wdTimedOut = true; ctrl.abort(); }
      }, 5000);
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        lastDataAt = Date.now();     // 收到任意字节（含保活帧）→ 喂狗
        buf += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {          // SSE 帧以空行分隔
          const frame = buf.slice(0, sep);
          buf = buf.slice(sep + 2);
          const line = frame.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
          gotAnyFrame = true;
          if (handleStreamEvent(ev)) {                      // done / error：收尾退出
            setTyping(false);
            reader.cancel().catch(() => {});
            return;
          }
        }
      }
      setTyping(false);
      if (!gotAnyFrame) {
        // 服务端一帧都没推就关流（异常）→ POST 重试一次拿回复
        clearExtUi();
        postChatFallback(text);
      }
    } catch (err) {
      setTyping(false);
      if (!sseAccepted) {
        // 流端点不可达（老版本 / 网关）→ POST 兜底；仍失败则回落演示模式
        clearExtUi();
        postChatFallback(text);
        return;
      }
      clearExtUi();
      if (wdTimedOut) {
        // 看门狗触发：不是「断流」而是「后端长时间零进展」，措辞要能指导用户
        addMessage({ role: 'system', text: '响应超时：超过 2 分钟没有收到任何数据，已中止本次请求。请重新发送一次。' });
      } else {
        // 半途断流：Agent 已消耗一轮执行，不能重放 POST（转账/落库会重复执行），提示重发
        addMessage({ role: 'system', text: '连接中断，未收到完整回复，请重新发送一次。' });
      }
    } finally {
      // ★ 所有出口（含上面的中途 return）都必须停掉看门狗，避免泄漏定时器
      if (wd) clearInterval(wd);
    }
  };

  /* POST /api/chat 兜底（SSE 端点缺位 / 网络异常时）；语义与旧版 realSend 完全一致 */
  const postChatFallback = async (text) => {
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: authHeaders({
          'Content-Type': 'application/json',
          'X-Digital-Human': localStorage.getItem('xb_digital_human') === '1' ? '1' : '0',
        }),
        body: JSON.stringify({ thread_id: threadId, message: text }),
      });
      const data = await res.json().catch(() => ({}));
      setTyping(false);
      if (!res.ok) {
        addMessage({ role: 'system', text: '后端调用失败：' + (data.detail || ('HTTP ' + res.status)) });
        return;
      }
      renderChatPayload(data);
    } catch (err) {
      // 网络级失败（服务不可达）→ 自动回落演示模式
      setTyping(false);
      setMode('demo');
      demoReply(text);
    }
  };

  const updateConfirmMsg = (id, stage) =>
    setMessages(ms => ms.map(m => (m.id === id ? { ...m, stage } : m)));
  const handleRealConfirm = (id) => { updateConfirmMsg(id, 'confirmed'); realSend('确认'); };
  const handleRealCancel  = (id) => { updateConfirmMsg(id, 'cancelled'); realSend('取消'); };

  /* 统一投递口：输入框发送 / 快捷指令 / 语音对话收口都走这里（行为与旧版完全一致） */
  const sendText = (raw) => {
    const text = String(raw == null ? '' : raw).trim();
    if (!text) return;
    setInput('');
    interactedRef.current = true;
    // 第 2 步：语音/文字含「打开XX页面」意图 → 主动跳转（数字人跨页控制页面基本功能）
    const navIntent = detectNavIntent(text);
    if (navIntent) navigate(navIntent.to);
    const item = { id: nextId(), text };
    // ★ 上一轮还在回答 → 只渲染气泡 + 进排队队列，**不并发提交**
    //   （提交时机统一交给 typing 落回 false 后的 drainRound：只发最后一条）
    if (inFlightRef.current) {
      addMessage({ role: 'user', text, queued: true, id: item.id });
      queuedRef.current = [...queuedRef.current, item];
      setPendingN(queuedRef.current.length);
      return;
    }
    addMessage({ role: 'user', text, id: item.id });
    submitQuestion(item);
  };
  sendTextRef.current = sendText;    // 供语音对话状态机（定时器/闭包）调用

  const handleSend = () => sendText(input);
  /* 快捷操作（发送类）：一击即发，不等回车。
     文案由调用方给全（输入框已有内容时调用方已做追加），这里只负责投递。 */
  const handleQuickSend = (text) => sendText(text);

  /* 新会话：清空消息（真实模式同时换 thread 并持久化，再拉取个性化问候语） */
  const handleNewChat = () => {
    setMessages([]);
    setChatVerify(null);
    setConfirmStage(null);
    setTyping(false);
    resetQueue();                // ★ 队列也一起清：新会话不该带着旧会话的排队/待补答
    resetPrivacyOn();            // A3：新会话强制重置隐私模式为"开"
    setPrivacy(true);
    refreshUnread();
    clearExtUi();   // 新会话：清掉遗留的 MCP 工具胶囊 / 慢调用提示
    if (mode === 'real') {
      const tid = 'web-' + Math.random().toString(36).slice(2, 8);
      applyThreadId(tid);
      showGreeting(tid);
      refreshConversations();
    }
  };

  /* 切换到历史会话：回读消息；空会话（仅问候语被删等情况）补一条问候 */
  const switchConversation = (tid) => {
    if (tid === threadId) return;
    setMessages([]);
    setChatVerify(null);
    setConfirmStage(null);
    setTyping(false);
    resetQueue();   // ★ 队列也一起清：别把上一会话的排队/待补答带过来
    clearExtUi();   // 切换会话：清掉上一会话遗留的 MCP 工具胶囊 / 慢调用提示
    applyThreadId(tid);
    loadHistory(tid).then(n => { if (n === 0) showGreeting(tid); });
  };

  /* 删除会话：后端删库内记录；若删的正是当前会话，顺手开一个新会话 */
  const removeConversation = (tid) => {
    fetch(`/api/conversations/${encodeURIComponent(tid)}`, { method: 'DELETE', headers: authHeaders() })
      .then(r => r.json())
      .then(() => {
        refreshConversations();
        if (tid === threadId) handleNewChat();
      })
      .catch(() => {});
  };

  const meta = routeMeta(route);
  const shownName = userName || (mode === 'real' ? '用户' : PLACEHOLDER.userName);
  const { setPrivacy } = usePrivacy();

  /* ============ C7 信息架构：弹窗 / 会话栏折叠 / 旧路由重定向 ============ */
  /* 资料弹窗 / 实名弹窗（用户菜单唯一入口；旧 /profile、/realname 路由重定向到此） */
  const [modalOpen, setModalOpen] = useState(null);   // 'profile' | 'realname' | null
  const [profileNonce, setProfileNonce] = useState(0); // 保存成功 → 顶栏用户区称呼联动刷新
  /* 会话栏折叠：按用户维度存 localStorage（不同用户偏好独立） */
  const convBarKey = 'xb_convbar_' + (userName || 'guest');
  const [convCollapsed, setConvCollapsed] = useState(() => localStorage.getItem('xb_convbar_' + (localStorage.getItem('xb_user') || 'guest')) === 'min');
  const toggleConvBar = () => {
    markConvHintSeen();   // 任何一次收起/展开都算"已知晓快捷键"
    setConvCollapsed(v => !v);   // ★ 纯更新函数（并发模式可能重放，副作用一律不进来）
  };
  /* 持久化放 effect：状态真值变化才写，与渲染结果永远一致 */
  useEffect(() => {
    if (userName) localStorage.setItem(convBarKey, convCollapsed ? 'min' : 'max');
  }, [convCollapsed, convBarKey, userName]);
  /* Ctrl+B / Cmd+B 切换会话栏（与主流编辑器一致） */
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'b') {
        e.preventDefault();
        markConvHintSeen();
        toggleConvBar();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [convBarKey]);
  /* 旧路由重定向：/profile → 对话页 + 资料弹窗；/realname → 对话页 + 实名弹窗 */
  useEffect(() => {
    if (route === '/profile' || route === '/realname') {
      setModalOpen(route === '/profile' ? 'profile' : 'realname');
      setRoute('/chat');
      if (window.location.hash !== '#/chat') window.location.hash = '/chat';
    }
  }, [route]);
  /* 当前会话标题（轻量会话信息条用；演示模式无持久化 → 新会话） */
  const sessionTitle = (conversations.find(c => c.conversation_id === threadId) || {}).title || '新会话';

  return (
    <BalanceCtx.Provider value={balance}>
      <div className="h-screen flex flex-col">
        <TopBar userName={shownName} mode={mode} title={meta.title} icon={meta.icon}
                unread={unread} inboxOpen={inboxOpen} onToggleInbox={() => setInboxOpen(v => !v)}
                inboxFlash={inboxFlash}
                onOpenProfile={() => setModalOpen('profile')}
                onOpenRealname={() => setModalOpen('realname')}
                profileNonce={profileNonce} />
        <div className="flex-1 flex min-h-0">
          <SideNav current={route} userName={shownName} mode={mode} onPick={goChatWith} />

          {/* 会话列表（审计项 M2）：仅在真实模式的对话页出现 —— 演示模式无持久化，列表为空无意义。
              C7：支持折叠为 56px 窄条（Ctrl+B），与功能导航栏相互独立 */}
          {route === '/chat' && mode === 'real' && (
            <ConvList conversations={conversations} currentId={threadId}
                      onSwitch={switchConversation} onNew={handleNewChat}
                      onDelete={removeConversation}
                      collapsed={convCollapsed} onToggle={toggleConvBar} />
          )}

          {route === '/chat'
            ? (
              <ChatPane
                messages={messages} input={input} setInput={setInput}
                confirmStage={confirmStage} mode={mode} typing={typing}
                sessionTitle={sessionTitle} userName={shownName}
                toolCapsules={toolCapsules} extStatus={extStatus}
                onSend={handleSend} onQuickSend={handleQuickSend}
                speech={speech} vd={vd}
                pendingN={pendingN}
                onAskMoreContinue={onAskMoreContinue} onAskMoreSkip={onAskMoreSkip}
                onNewChat={handleNewChat}
                    chatVerify={chatVerify}
                    onVerifyCode={(c) => { setChatVerify(null); dispatchInline(c); }}
                    onVerifyPassword={(needSet) => { setChatVerify(null); dispatchInline(needSet ? PWD_SET_PLACEHOLDER : PWD_RESUME_PLACEHOLDER); }}
                    onOpenInbox={() => setInboxOpen(true)}
                onConfirm={handleConfirm} onCancel={handleCancel}
                onRealConfirm={handleRealConfirm} onRealCancel={handleRealCancel}
                scrollRef={scrollRef} inputRef={inputRef}
                streamedRef={streamedRef} onStreamed={markStreamed} />
            )
            : (
              <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                {route === '/transfer' && <TransferPage key="transfer" />}
                {route === '/bills'  && <BillsPage  key="bills"  />}
                {route === '/wealth' && <WealthPage key="wealth" />}
                {route === '/cards'  && <CardsPage  key="cards"  />}
                {route === '/subs'   && <SubsPage   key="subs"   />}
                {route === '/safe'   && <SafePage   key="safe"   />}
                {route === '/appearance' && <AppearancePage key="appearance" />}
                {/* C7：/profile、/realname 页面形式已下线（上方 effect 重定向到对话页 + 弹窗） */}
              </div>
            )}

        </div>

        {/* 数字柜员「小微」全局浮层（Fay iframe 隔离；开关关闭 / 窄屏 <1024px → 不渲染）。
            ★ 提升到 App 根、固定定位，跨所有 hash 路由常驻（对话页 / 账单页 / 理财页…均不卸载） */}
        <DigitalHumanPanel vd={vd} />

        {/* C4 收件箱抽屉（右侧滑出） */}
        {/* 写操作被拦截时的引导卡：就地弹出（不跳转、不报错红条），点「暂不」关闭 */}
        {bindGuide && (
          <div className="fixed inset-0 z-[60] flex items-center justify-center px-4"
               style={{ background: 'rgba(15,23,42,0.38)' }}
               onClick={() => setBindGuide(false)}>
            <div className="w-full max-w-md animate-slide-up" onClick={e => e.stopPropagation()}>
              <PhoneBindGuide onClose={() => setBindGuide(false)} />
            </div>
          </div>
        )}
        <InboxDrawer open={inboxOpen} onClose={() => setInboxOpen(false)} onChanged={refreshUnread} />

        {/* C7：资料弹窗 / 实名弹窗（用户菜单唯一入口；ESC / 遮罩关闭） */}
        {modalOpen === 'profile' && (
          <ProfileModal onClose={() => setModalOpen(null)}
                        onOpenRealname={() => setModalOpen('realname')}
                        onSaved={() => setProfileNonce(n => n + 1)} />
        )}
        {modalOpen === 'realname' && (
          <RealnameModal onClose={() => setModalOpen(null)} />
        )}
      </div>
    </BalanceCtx.Provider>
  );
}

/* ============================================================
   会话列表面板（审计项 M2）
   —— 会话此前只活在 React 内存里，刷新即丢且无列表入口。
      现在数据来自 MySQL conversations / chat_messages，支持切换、新建、删除。
   C7 信息架构：支持折叠为 56px 窄条（展开/收起、Ctrl+B、hover 半展开预览、
      中央"+"新建并自动展开）；折叠状态按用户维度存 localStorage；
      与功能导航栏（SideNav）相互独立、不联动。
   ============================================================ */
function ConvList({ conversations, currentId, onSwitch, onNew, onDelete, collapsed, onToggle }) {
  const current = conversations.find(c => c.conversation_id === currentId);
  const currentTitle = (current && current.title) || '新会话';
  /* ★ 删除会话 = 两步确认：点一下按钮变「确认」，再点一次才真删。
     原因：删除键是悬停才出现的，一步直达太容易误点，而会话删掉不可恢复。
     （此前这个按钮是个**空按钮** —— 0-icon 改造时删了图标却没补文字，
       既看不见又没内容，用户根本找不到删除入口。） */
  const [armedDel, setArmedDel] = useState(null);

  /* ---------- 收起态：56px 窄条 ---------- */
  if (collapsed) {
    return (
      <aside className="convbar-min shrink-0 border-r border-slate-200/70 bg-panel flex flex-col items-center py-3">
        {/* 窄条内容（hover 半展开时淡出） */}
        <div className="mini flex flex-col items-center gap-3 w-full">
          <button onClick={onToggle} title="展开会话列表 (Ctrl+B)"
                  className="w-9 h-9 rounded-lg text-[15px] text-slate-500
                             hover:text-brand-600 hover:bg-brand-50 transition-colors leading-none">›</button>
          {/* 当前会话首字徽标 */}
          <div title={currentTitle}
               className="w-9 h-9 rounded-full flex items-center justify-center text-[14px] font-semibold shrink-0"
               style={{ backgroundImage: T.blueIndigo, color: '#1A1408' }}>
            {currentTitle[0]}
          </div>
          {/* 新建会话：点击直接新建并自动展开 */}
          <button onClick={() => { onToggle(); onNew(); }} title="新建会话"
                  className="w-9 h-9 rounded-lg text-[18px] text-slate-400 leading-none
                             hover:text-brand-600 hover:bg-brand-50 transition-colors">+</button>
        </div>
        {/* 悬浮预览层：hover 300ms 后半展开，仅标题列 */}
        <div className="full absolute left-0 top-0 h-full w-[216px] bg-panel border-r border-slate-200/70
                        flex flex-col opacity-0 pointer-events-none">
          <div className="h-[68px] shrink-0 flex items-center justify-between gap-2 px-4 border-b border-slate-100">
            <span className="text-[14px] font-semibold text-slate-700">会话</span>
            <button onClick={onToggle} title="收起会话列表 (Ctrl+B)"
                    className="px-2 py-1 rounded-lg text-[12px] text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition-colors">‹</button>
          </div>
          <div className="flex-1 overflow-y-auto scroll-thin p-2 space-y-1">
            {conversations.map(c => {
              const active = c.conversation_id === currentId;
              return (
                <div key={c.conversation_id} onClick={() => onSwitch(c.conversation_id)}
                     className={`px-3 py-2.5 rounded-xl cursor-pointer text-[13px] truncate transition-colors
                       ${active ? 'bg-brand-50 text-brand-700 font-medium' : 'text-slate-600 hover:bg-slate-50'}`}>
                  {c.title || '新会话'}
                </div>
              );
            })}
          </div>
          <div className="p-2 border-t border-slate-100">
            <button onClick={() => { onToggle(); onNew(); }}
                    className="w-full py-2 rounded-lg text-[12px] text-slate-500 hover:text-brand-600 hover:bg-brand-50 transition-colors">+ 新建会话</button>
          </div>
        </div>
      </aside>
    );
  }

  /* ---------- 展开态（现状） ---------- */
  return (
    <aside className="w-[216px] shrink-0 bg-panel border-r border-slate-200/70 flex flex-col">
      <div className="h-[68px] shrink-0 flex items-center justify-between gap-2 px-4 border-b border-slate-100">
        <div className="flex items-center gap-2 min-w-0">
          <span className="text-[14px] font-semibold text-slate-700 truncate">会话</span>
        </div>
        <div className="flex items-center gap-1.5 shrink-0">
          <button onClick={onNew} title="新建会话"
            className="px-2 py-1 rounded-lg text-[12px] text-slate-400
                       hover:text-brand-600 hover:bg-brand-50 transition-colors">
            新建
          </button>
          <button onClick={onToggle} title="收起会话列表 (Ctrl+B)"
                  className="w-7 h-7 rounded-lg text-[14px] text-slate-400 leading-none
                             hover:text-brand-600 hover:bg-brand-50 transition-colors">‹</button>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto scroll-thin p-2 space-y-1">
        {conversations.length === 0 && (
          <div className="px-3 py-8 text-center text-[12px] text-slate-400 leading-relaxed">
            暂无历史会话<br />发一条消息试试
          </div>
        )}

        {conversations.map(c => {
          const active = c.conversation_id === currentId;
          return (
            <div key={c.conversation_id}
              onClick={() => onSwitch(c.conversation_id)}
              title={c.title}
              className={`group flex items-center gap-2 px-3 py-2.5 rounded-xl cursor-pointer
                          transition-all duration-200
                ${active
                  ? 'bg-brand-50 text-brand-700 shadow-[inset_0_0_0_1px_rgba(212,160,23,0.18)]'
                  : 'text-slate-600 hover:bg-slate-50'}`}>
              <div className="flex-1 min-w-0">
                <div className="text-[13px] font-medium truncate leading-tight">{c.title || '新会话'}</div>
                <div className="text-[11px] text-slate-400 truncate mt-0.5">
                  {c.msg_count > 0 ? c.msg_count + ' 条消息' : '未开始'}
                </div>
              </div>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (armedDel === c.conversation_id) { setArmedDel(null); onDelete(c.conversation_id); }
                  else setArmedDel(c.conversation_id);
                }}
                onPointerLeave={() => setArmedDel(a => (a === c.conversation_id ? null : a))}
                title={armedDel === c.conversation_id ? '再点一次确认删除' : '删除会话'}
                className={`shrink-0 h-6 px-1.5 rounded-md text-[11px] leading-none
                            flex items-center justify-center whitespace-nowrap transition-all ${armedDel === c.conversation_id
                  ? 'opacity-100 text-rose-600 bg-rose-50 font-medium'
                  : 'opacity-45 group-hover:opacity-100 text-slate-400 hover:text-rose-600 hover:bg-rose-50'}`}>
                {armedDel === c.conversation_id ? '确认' : '删'}
              </button>
            </div>
          );
        })}
      </div>

      {/* Ctrl+B 快捷键提示（首次使用后消失） */}
      <div className="shrink-0 px-4 py-2.5 border-t border-slate-100 text-[10.5px] text-slate-400">
        {convHintSeen() ? '会话切换 · 新建 · 删除'
          : <span>提示：Ctrl+B 可收起 / 展开会话栏</span>}
      </div>
    </aside>
  );
}

/* Ctrl+B 提示标记（看过一次就不再显示） */
function convHintSeen() {
  return !!localStorage.getItem('xb_ctrlb_hint_seen');
}
function markConvHintSeen() {
  localStorage.setItem('xb_ctrlb_hint_seen', '1');
}

/* ============================================================
   ① 对话页面板
   —— 顶部小尺寸账户横幅 + 消息流 + 输入区
   ============================================================ */
/* 对话区上方活动条：MCP「实时」工具胶囊（转圈 → ✓）+ 慢调用状态提示。
   由 /api/chat/stream 的 tool / tool_result / status 帧驱动；无内容时不占位。
   —— 展示的是"正在调用外部实时数据源"这一过程本身，结果随回复正文一起出现 */
function ExtActivityBar({ capsules = [], status = null }) {
  if (capsules.length === 0 && !status) return null;
  return (
    <div className="shrink-0 px-8 pt-3 flex flex-wrap items-center gap-2">
      {capsules.map(c => (
        <span key={c.id}
              className="inline-flex items-center gap-1.5 pl-2 pr-3 py-1.5 rounded-full text-[12px] font-medium
                         text-cyan-600 bg-cyan-50 border border-cyan-200 animate-slide-up"
              title={c.name}>
          {c.status === 'loading'
            ? <span className="w-3 h-3 rounded-full border-[2px] border-cyan-200 border-t-cyan-500 animate-spin" />
            : <span className="w-3 h-3 rounded-full bg-emerald-500" />}
          <span className="text-[10px] leading-none font-semibold px-1.5 py-[3px] rounded-md bg-cyan-100 text-cyan-600">实时</span>
          <span className="max-w-[150px] truncate">{c.label}</span>
          {c.status === 'done' && c.elapsed_s != null &&
            <span className="text-[11px] text-cyan-400 font-mono">{c.elapsed_s}s</span>}
        </span>
      ))}
      {status && (
        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[12px] text-slate-500
                         bg-panel border border-slate-200 shadow-sm animate-slide-up">
          <span className="w-3 h-3 rounded-full border-[2px] border-slate-200 border-t-brand-500 animate-spin" />
          {status}
        </span>
      )}
    </div>
  );
}

function ChatPane({ messages, input, setInput, confirmStage, mode, typing,
                    toolCapsules, extStatus, sessionTitle,
                    onSend, onQuickSend, onNewChat, onConfirm, onCancel, onRealConfirm, onRealCancel,
                    chatVerify, onVerifyCode, onVerifyPassword, onOpenInbox,
                    scrollRef, inputRef, streamedRef, onStreamed, userName,
                    speech, vd, pendingN, onAskMoreContinue, onAskMoreSkip }) {
  return (
    <div className="flex-1 flex min-w-0">
      {/* 对话主区：角落装饰光斑（电光青 + 琥珀金，超低透明度，不干扰阅读） */}
      <div className="flex-1 relative flex justify-center min-w-0 overflow-hidden">
        <span className="pointer-events-none absolute -top-24 -right-24 w-[420px] h-[420px] rounded-full
                         opacity-[0.07] blur-3xl animate-float"
              style={{ backgroundImage: 'linear-gradient(135deg,#00E5C7 0%,#0A6E62 100%)' }} />
        <span className="pointer-events-none absolute -bottom-32 -left-20 w-[380px] h-[380px] rounded-full
                         opacity-[0.06] blur-3xl animate-float"
              style={{ backgroundImage: 'linear-gradient(135deg,#D4A017 0%,#3A2E10 100%)', animationDelay: '-6s' }} />

        <main className="relative w-full max-w-[860px] flex flex-col min-w-0">
          {/* C7 轻量会话信息条（≤48px）：会话标题 + 在线状态青点 + 新会话；
              顶栏资产三卡已停用 —— 金额只在账单 / 卡片 / 转账等工作台页面展示 */}
          <div className="shrink-0 h-[48px] flex items-center justify-between gap-3 px-8 border-b border-slate-200/60">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="relative flex w-2 h-2 shrink-0">
                <span className="absolute inset-0 rounded-full bg-cyan-400 animate-pulse opacity-60" />
                <span className="relative w-2 h-2 rounded-full bg-cyan-400" />
              </span>
              <span className="text-[14px] font-medium text-slate-700 truncate">{sessionTitle}</span>
              <span className="text-[11px] text-slate-400 shrink-0">小微在线</span>
            </div>
            <button onClick={onNewChat} title="开始新会话"
                    className="shrink-0 px-3 py-1 rounded-full text-[12px] font-medium text-slate-500 border border-slate-200
                               hover:text-brand-600 hover:border-brand-200 hover:bg-brand-50 transition-all duration-200">
              新会话
            </button>
          </div>

          {/* MCP 外部实时数据：工具胶囊 + 慢调用状态条（真实模式且收到 tool/status 帧才出现） */}
          <ExtActivityBar capsules={toolCapsules} status={extStatus} />

          <div ref={scrollRef} className="flex-1 min-h-0 overflow-y-auto scroll-thin px-8 py-7 space-y-6">
            {messages.length === 0
              ? <EmptyState onPick={setInput} userName={userName} />
              :                 messages.map(m => {
                  if (m.role === 'user') return <UserMessage key={m.id} text={m.text} queued={m.queued} />;
                  if (m.role === 'system') return <SecurityMessage key={m.id} text={m.text} />;
                  if (m.role === 'ask_more') return <AskMoreCard key={m.id} onContinue={onAskMoreContinue} onSkip={onAskMoreSkip} />;
                  if (m.role === 'assistant') return <AssistantMessage key={m.id} msg={m} demo={mode !== 'real'} streamedRef={streamedRef} onStreamed={onStreamed} />;
                  if (m.role === 'confirm') {
                    const isDemo = !m.fields;
                    const stage = isDemo ? (confirmStage === 'done_pending' ? 'confirmed' : confirmStage) : m.stage;
                    return (
                      <div key={m.id} className="flex items-start gap-3">
                        <AssistantAvatar />
                        <ConfirmCard
                          stage={stage} fields={m.fields} amount={m.amount}
                          onConfirm={() => (isDemo ? onConfirm() : onRealConfirm(m.id))}
                          onCancel={() => (isDemo ? onCancel() : onRealCancel(m.id))} />
                      </div>
                    );
                  }
                  if (m.role === 'suggest_transfer') return <TransferGuideCard key={m.id} text={m.text} navigate={navigate} />;
                  if (m.role === 'suggest_bind_phone') {
                    return (
                      <div key={m.id} className="flex items-start gap-3">
                        <AssistantAvatar />
                        <div className="max-w-[80%] flex-1"><PhoneBindGuide /></div>
                      </div>
                    );
                  }
                  return <AssistantMessage key={m.id} msg={m} demo={mode !== 'real'} streamedRef={streamedRef} onStreamed={onStreamed} />;
                })}
          </div>

          {/* B4：对话内安全验证卡（挂起时显示；完成后自动消失） */}
          {chatVerify && (
            <div className="shrink-0 px-8 pb-3">
              <VerifyPanel info={chatVerify} busy={typing}
                onCodeSubmit={onVerifyCode}
                onPasswordPassed={onVerifyPassword}
                onOpenInbox={onOpenInbox} />
            </div>
          )}
          {/* 「与小微对话」模式状态条（未开启时不渲染） */}
          <VoiceDialogBar vd={vd} speech={speech} />
          <ChatInput input={input} setInput={setInput} onSend={onSend} onQuickSend={onQuickSend}
                     typing={typing} inputRef={inputRef} speech={speech} vd={vd} pendingN={pendingN} />
        </main>
      </div>
    </div>
  );
}

/* C7 信息架构：对话页顶部资产横幅（AccountBanner）已整体移除 ——
   金额只在账单 / 卡片 / 转账等工作台页面展示，对话页保持纯对话沉浸。
   顶栏组件本身保留（其他页面引用不受影响）。
   ============================================================ */

ReactDOM.createRoot(document.getElementById('root')).render(
  <PrivacyProvider><UserProvider><App /></UserProvider></PrivacyProvider>
);
</script>
</body>
</html>
