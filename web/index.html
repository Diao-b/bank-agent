  );
}

function TransferPage() {
  const [step, setStep] = useState(1);
  const [ver, setVer] = useState(0);                 // bump → 重拉收款人 / 余额
  const pys = useApi('/api/payees', [ver]);
  const bal = useApi('/api/balance', [ver]);
  const banksApi = useApi('/api/bank-directory', []);
  const banks = (banksApi.data && banksApi.data.banks) || [];
  /* 实名脱敏：库里存全名，展示统一「姓 + *」（与后端 mask_real_name 口径一致） */
  const maskName = (n) => {
    const s = String(n || '');
    if (!s) return '';
    return s.length <= 1 ? '*' : (s[0] + '*'.repeat(s.length - 1));
  };
  const { phoneBound } = useUser();              // 写操作闸门：提交转账 / 新增收款人前先查绑定态
  const payees  = (pys.data && pys.data.payees)   || [];
  const accounts = (bal.data && bal.data.accounts) || [];

  /* ---- 表单参数 ---- */
  const [payeeId, setPayeeId] = useState(null);
  const [amount, setAmount]   = useState('');
  const [remark, setRemark]   = useState('');
  const [fromId, setFromId]   = useState(null);      // null = 不传，由后端取主账户
  const [kw, setKw] = useState('');

  /* ---- 尾号校验（防转错人）----
     选中收款人后输入 / 核对卡号后四位，**失焦**才触发 /api/payees/check
     （★已知坑：别做成每键触发，那是无谓的接口风暴；尾号不符只提醒、不阻断提交） */
  const [tailInput, setTailInput]   = useState('');
  const [tailCheck, setTailCheck]   = useState(null);   // {found, match, is_insite, message, account_tail…}
  const [tailChecking, setTailChecking] = useState(false);
  /* 换收款人 → 清空上一轮的尾号与校验结果，避免张冠李戴 */
  useEffect(() => { setTailInput(''); setTailCheck(null); }, [payeeId]);

  /* ---- 新增收款人（唯一合法的建收款人途径）----
     ★ 账户校验模型：必须「选择开户行（来自银行目录）+ 完整卡号（Luhn 校验）」，
       不再允许只填姓名 + 卡号后四位就建收款人 —— 那是"随便填个名字就能转"的漏洞。
       微众银行（本行）卡号由后端反查账户，实名以系统实名覆盖（防伪冒名）；
       他行无法验证对方账户，故真实姓名必填。 */
  const [adding, setAdding]   = useState(false);
  const [addBusy, setAddBusy] = useState(false);
  const [addMsg, setAddMsg]   = useState(null);
  const [bankId, setBankId]   = useState(null);
  const [payeeName, setPayeeName] = useState('');
  const [cardInput, setCardInput]   = useState('');     // 4-4-4-4 分体展示值
  const [cardCheck, setCardCheck]   = useState(null);   // {valid, bank_id, bank_name, is_local, message}
  const [checkBusy, setCheckBusy]   = useState(false);
  const [realName, setRealName]     = useState('');
  const [addResult, setAddResult]   = useState(null);   // {track, text} 验证结果反馈

  /* 4-4-4-4 格式化：仅保留数字，每 4 位一组空格分隔（真实银行 App 卡号输入体验） */
  const fmtCard = (v) => (String(v || '').replace(/\D/g, '').slice(0, 16).match(/.{1,4}/g) || []).join(' ');
  const rawCard = String(cardInput || '').replace(/\D/g, '');
  const selBank = banks.find(b => b.id === bankId) || null;
  /* 本行（微众）→ 实名由系统给出，不用填；他行 → 真实姓名必填 */
  const needRealName = !!selBank && !selBank.is_local;

  /* ---- 执行态 ---- */
  const [nodes, setNodes]   = useState([]);
  const [stage, setStage]   = useState('idle');       // idle|running|verify|confirm|done|error
  /* C3/B4：验证阶段信息 {factor, need_set, queue}——按类型渲染验证码/密码卡 */
  const [verifyInfo, setVerifyInfo] = useState(null);
  const [confirmCard, setConfirmCard] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const [errText, setErrText] = useState('');
  const [busy, setBusy]     = useState(false);

  /* 留痕写回哪个会话：沿用对话页当前会话，办完回对话页就能看到这笔转账 */
  const convIdRef = useRef(localStorage.getItem('xb_thread') || 'web');

  const payee = payees.find(p => p.id === payeeId) || null;
  /* 付款账户口径必须与后端一致：未显式指定时扣「id 最小的账户」 */
  const payAcc = fromId != null
    ? accounts.find(a => a.id === fromId)
    : (accounts.length ? accounts.reduce((m, a) => (a.id < m.id ? a : m), accounts[0]) : null);

  /* A4：步骤②余额 click 级遮蔽；本会话内点开一次即保持（不自动回遮） */
  const [balShown, setBalShown] = useState(false);
  const amtNum = Number(amount);
  const amtValid = amount !== '' && Number.isFinite(amtNum) && amtNum > 0;
  const avail = payAcc ? Number(payAcc.balance) : null;
  /* 余额实时拦截：填的时候就红，不等提交 */
  const overBalance = amtValid && avail != null && amtNum > avail;
  const canNext2 = amtValid && !overBalance;
  /* 非常用收款人 → 后端风控必触发短信验证，提前告知用户 */
  const willVerify = !!payee && (!payee.is_frequent || amtNum > 5000);

  const shown = payees.filter(p => {
    const k = kw.trim();
    if (!k) return true;
    return (p.nickname + p.bank + p.account_tail).indexOf(k) >= 0;
  });

  const inputCls = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-panel text-sm text-slate-700 '
                 + 'outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition';

  /* ---------- 尾号核对：GET /api/payees/check（仅提醒，不改安全流程） ----------
     ★ 无论结果如何，风控分级 / 验证 / 确认照常执行；最终以选中的 payee 账户为准。 */
  const runTailCheck = async () => {
    if (!payee) return;
    const t = String(tailInput || '').trim();
    if (!t) { setTailCheck(null); return; }
    setTailChecking(true);
    try {
      const qs = '?nickname=' + encodeURIComponent(payee.nickname) + '&card_tail=' + encodeURIComponent(t);
      const res = await fetch('/api/payees/check' + qs, { headers: authHeaders() });
      const d = await res.json().catch(() => ({}));
      setTailCheck(d && d.found ? d : { found: false, message: '未找到该收款人，可在常用收款人列表中选择或新增' });
    } catch (err) {
      setTailCheck({ found: false, message: '尾号校验暂不可用' });
    } finally {
      setTailChecking(false);
    }
  };

  /* ---------- 卡号即时校验（失焦触发）：GET /api/card/validate ----------
     ★ Luhn / BIN 校验逻辑复用后端 utils.card_validator —— 前端不重复实现算法，
       避免前后端口径漂移。这里只负责展示「卡号有效（招商银行）」/「卡号无效」。 */
  const runCardCheck = async () => {
    const digits = rawCard;
    if (digits.length < 12) { setCardCheck(null); return; }
    setCheckBusy(true);
    try {
      const res = await fetch('/api/card/validate?card_no=' + encodeURIComponent(digits),
                              { headers: authHeaders() });
      const d = await res.json().catch(() => ({}));
      setCardCheck(d && d.ok ? d : { valid: false, message: '卡号校验暂不可用' });
    } catch (err) {
      setCardCheck({ valid: false, message: '卡号校验暂不可用' });
    } finally {
      setCheckBusy(false);
    }
  };

  /* ---------- 新增收款人（POST /api/payees/create） ----------
     提交后按后端返回渲染验证结果：
       站内 → 绿色「小微用户·实时到账」；跨行 → 蓝色「跨行账户·在途清算」；
       拒绝（如虚拟卡号不存在 / 卡号与所选银行不符）→ 红色如实提示。 */
  const addPayee = async (e) => {
    e.preventDefault();
    if (!requireBind(phoneBound)) return;    // 新增收款人是写操作，未绑定先引导
    const name = String(payeeName || '').trim();
    if (!name) { setAddResult({ track: 'error', text: '请填写收款人昵称' }); return; }
    if (!bankId) { setAddResult({ track: 'error', text: '请选择开户银行' }); return; }
    if (rawCard.length < 12) { setAddResult({ track: 'error', text: '请填写完整卡号' }); return; }
    if (needRealName && !String(realName || '').trim()) {
      setAddResult({ track: 'error', text: '跨行收款人需填写对方真实姓名' });
      return;
    }
    setAddBusy(true); setAddResult(null); setAddMsg(null);
    try {
      const res = await fetch('/api/payees/create', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          payee_name: name,
          bank_id: bankId,
          card_no: rawCard,
          real_name: String(realName || '').trim() || null,
        }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || d.ok === false) throw new Error(d.error || d.detail || ('HTTP ' + res.status));
      setAddResult({ track: d.track || (d.payee && d.payee.linked_user_id ? 'insite' : 'cross_bank'),
                     text: d.message || '已新增收款人' });
      setPayeeName(''); setBankId(null); setCardInput(''); setCardCheck(null); setRealName('');
      setVer(v => v + 1);
      if (d.payee && d.payee.id) setPayeeId(d.payee.id);   // 自动选中，少点一次
      setAdding(false);
    } catch (err) {
      setAddResult({ track: 'error', text: '新增失败：' + err.message });
    } finally {
      setAddBusy(false);
    }
  };

  /* ---------- SSE 帧处理 ---------- */
  const onEvent = (ev) => {
    if (!ev || !ev.type) return false;
    if (ev.type === 'node') {
      setNodes(ns => {
        const item = { node: ev.node, label: ev.label, phase: ev.phase, detail: ev.detail };
        const i = ns.findIndex(n => n.node === ev.node);
        if (i < 0) return ns.concat([item]);
        const out = ns.slice(); out[i] = item; return out;   // 同节点重放 → 原地更新
      });
      return false;
    }
    if (ev.type === 'done')  { applyPayload(ev.payload); return true; }
    if (ev.type === 'error') { setStage('error'); setErrText(ev.detail || '执行失败'); return true; }
    return false;
  };

  const applyPayload = (p) => {
    if (!p) { setStage('error'); setErrText('服务端未返回结果'); return; }
    if (p.kind === 'verify')  { setVerifyInfo({ factor: p.factor || p.verify, need_set: p.need_set, queue: p.queue || [] }); setStage('verify'); return; }
    if (p.kind === 'confirm') { setConfirmCard({ fields: p.fields || [], amount: p.amount }); setStage('confirm'); return; }
    /* kind === 'text' → 终态：成功回执，或被风控/余额/取消拦下的说明 */
    if (p.suggest === 'bind_phone') {
      setStage('error');
      setErrText(p.reply || '请先绑定手机号后再办理资金业务');
      showBindGuide();          // 就地弹「去绑定手机」引导卡（方式 B 的表单路径）
      return;
    }
    if (p.receipt) { setReceipt(p.receipt); setStage('done'); setVer(v => v + 1); return; }
    const t = p.reply || '';
    if (/^(已完成|已成功|执行成功)/.test(t) || t.indexOf('已成功') === 0) { setReceipt(null); setStage('done'); setVer(v => v + 1); }
    else { setStage('error'); setErrText(t || '操作未完成'); }
  };

  /* ---------- 提交（进安全流程） ---------- */
  const submit = async () => {
    if (!payee || !canNext2) return;
    if (!requireBind(phoneBound)) return;    // 未绑手机号 → 引导卡；后端 phone_guard 也会拦
    setStep(4); setStage('running'); setNodes([]); setErrText(''); setReceipt(null);
    setVerifyInfo(null); setConfirmCard(null); setBusy(true);
    const params = { payee_id: payee.id, amount: amtNum };
    if (remark.trim()) params.remark = remark.trim();
    if (fromId != null) params.from_account_id = fromId;
    try {
      await streamTask('/api/chat/submit-task',
        { conversation_id: convIdRef.current, task: { type: 'write', action: 'transfer', params } },
        onEvent);
    } catch (err) {
      setStage('error'); setErrText(err.message);
    } finally { setBusy(false); }
  };

  /* ---------- 恢复挂起的流程（验证码 / 确认 / 取消） ---------- */
  const resume = async (value) => {
    setBusy(true); setStage('running');
    try {
      await streamTask('/api/chat/resume',
        { conversation_id: convIdRef.current, resume: value }, onEvent);
    } catch (err) {
      setStage('error'); setErrText(err.message);
    } finally { setBusy(false); }
  };

  const resetAll = () => {
    setStep(1); setStage('idle'); setNodes([]); setVerifyInfo(null); setConfirmCard(null);
    setReceipt(null); setErrText(''); setAmount(''); setRemark('');
    setVer(v => v + 1);
  };

  const btnPrimary = 'inline-flex items-center justify-center gap-1.5 rounded-xl px-5 py-2.5 text-[13px] font-semibold '
                   + 'bg-brand-600 hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed text-ongold '
                   + 'shadow-[0_4px_14px_rgba(212,160,23,0.28)] transition-all active:scale-[0.98]';
  const btnGhost = 'inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2.5 text-[13px] font-medium '
                 + 'border border-slate-200 text-slate-500 hover:bg-slate-50 transition-colors';

  return (
    <PageShell className="space-y-5">
      {/* 步骤条 + 安全说明 */}
      <section className="rounded-2xl bg-panel border border-slate-200/70 p-5 animate-slide-up"
               style={{ boxShadow: T.shadowCard }}>
        <TransferSteps step={step} />
        <div className="mt-4 flex items-start gap-2 text-[11px] text-slate-400 leading-relaxed">
          <span>
            本页仅收集转账要素。提交后由小微的安全工作流接管：风险检查 →（必要时）短信验证 → 你亲自确认 → 提交银行执行。
            <b className="text-slate-500 font-semibold">未经你确认，资金不会发生任何变动。</b>
          </span>
        </div>
      </section>

      {/* ---------------- 步骤 1：收款人 ---------------- */}
      {step === 1 && (
        <Panel title="选择收款人" icon="user"
               right={
                 <button onClick={() => { setAdding(a => !a); setAddMsg(null); }}
                         className="text-[11px] font-medium px-2.5 py-1 rounded-full text-brand-600 bg-brand-50
                                    border border-brand-100 hover:bg-brand-100 transition-colors">
                   {adding ? '收起' : '+ 新增收款人'}
                 </button>
               }>
          {adding && (
            <form onSubmit={addPayee} className="mb-4 p-4 rounded-xl bg-slate-50/70 border border-slate-100 space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <label className="block">
                  <span className="block text-[11px] text-slate-400 mb-1">收款人昵称（显示用）</span>
                  <input value={payeeName} onChange={e => setPayeeName(e.target.value)}
                         maxLength={32} className={inputCls} placeholder="如：李雷" />
                </label>
                <div>
                  <span className="block text-[11px] text-slate-400 mb-1">
                    开户银行（必选，不可自行填写）
                  </span>
                  <BankSelect banks={banks} value={bankId}
                              onChange={(id) => { setBankId(id); setCardCheck(null); }}
                              inputCls={inputCls} />
                </div>
              </div>

              <label className="block">
                <span className="block text-[11px] text-slate-400 mb-1">收款卡号（16 位）</span>
                <input value={cardInput}
                       onChange={e => setCardInput(fmtCard(e.target.value))}
                       onBlur={runCardCheck}
                       inputMode="numeric" autoComplete="off"
                       className={inputCls + ' font-mono tracking-[0.12em]'}
                       placeholder="0000 0000 0000 0000" />
              </label>

              {needRealName ? (
                <label className="block">
                  <span className="block text-[11px] text-slate-400 mb-1">
                    对方真实姓名（跨行必填，本行无法验证对方账户）
                  </span>
                  <input value={realName} onChange={e => setRealName(e.target.value)}
                         maxLength={64} className={inputCls} placeholder="如：王老板" />
                </label>
              ) : null}

              {selBank && selBank.is_local ? (
                <div className="flex items-start gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2">
                  <span className="text-[11.5px] text-emerald-700 leading-5">
                    本行账户将实时校验账户是否存在，收款人实名以系统实名为准
                  </span>
                </div>
              ) : null}

              {checkBusy ? (
                <div className="text-[11.5px] text-slate-400">正在校验卡号…</div>
              ) : cardCheck ? (
                <div className={'flex items-start gap-2 rounded-lg border px-3 py-2 '
                  + (cardCheck.valid ? 'border-emerald-200 bg-emerald-50' : 'border-rose-200 bg-rose-50')}>
                  <span className={'text-[12px] font-semibold leading-5 '
                    + (cardCheck.valid ? 'text-emerald-700' : 'text-rose-600')}>
                    {cardCheck.valid ? '✓' : '!'}
                  </span>
                  <span className={'text-[11.5px] leading-5 '
                    + (cardCheck.valid ? 'text-emerald-700' : 'text-rose-600')}>
                    {cardCheck.message}
                    {cardCheck.valid && selBank && cardCheck.bank_id !== selBank.id
                      ? '　→ 与所选开户行不符，请改选银行或核对卡号'
                      : ''}
                  </span>
                </div>
              ) : null}

              {addResult ? (
                <div className={'flex items-start gap-2 rounded-lg border px-3 py-2 '
                  + (addResult.track === 'insite' ? 'border-emerald-200 bg-emerald-50'
                     : addResult.track === 'cross_bank' ? 'border-brand-200 bg-brand-50'
                     : 'border-rose-200 bg-rose-50')}>
                  <span className={'text-[11.5px] leading-5 '
                    + (addResult.track === 'insite' ? 'text-emerald-700'
                       : addResult.track === 'cross_bank' ? 'text-brand-700'
                       : 'text-rose-600')}>
                    {addResult.text}
                  </span>
                </div>
              ) : null}

              <div className="flex items-center gap-3">
                <button type="submit" disabled={addBusy} className={btnPrimary}>
                  {addBusy ? '校验并提交中…' : '验证并保存收款人'}
                </button>
                <span className="text-[11px] text-amber-600 flex items-center gap-1">
                  新增收款人默认为「非常用」，向其转账会强制短信验证
                </span>
              </div>
            </form>
          )}
          {addMsg && (
            <div className={`mb-3 text-xs flex items-center gap-1.5 ${addMsg.ok ? 'text-emerald-600' : 'text-rose-500'}`}>
              {addMsg.text}
            </div>
          )}

          {payees.length > 4 && (
            <div className="mb-3 relative">
              <input value={kw} onChange={e => setKw(e.target.value)}
                     className={inputCls + ' pl-9'} placeholder="搜索昵称 / 银行 / 尾号" />
            </div>
          )}

          {pys.loading ? <Loading text="正在读取收款人…" />
            : pys.error ? <ErrBox text={pys.error} onRetry={() => setVer(v => v + 1)} />
            : shown.length === 0 ? <Empty text={kw ? '没有匹配的收款人' : '还没有收款人，先新增一个'} icon="user" />
            : (
              <div className="grid grid-cols-2 gap-2.5">
                {shown.map(p => {
                  const on = p.id === payeeId;
                  return (
                    <button key={p.id} onClick={() => setPayeeId(p.id)}
                      className={`text-left px-4 py-3 rounded-xl border transition-all duration-200
                        ${on ? 'border-brand-300 bg-brand-50/60 shadow-[inset_0_0_0_1px_rgba(212,160,23,0.25)]'
                             : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}>
                      <div className="flex items-center gap-2">
                        <span className="text-[14px] font-semibold text-slate-800 truncate">{p.nickname}</span>
                        {p.linked_user_id
                          ? <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 shrink-0">站内</span>
                          : <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-brand-50 text-brand-600 border border-brand-100 shrink-0">跨行</span>}
                        {p.is_frequent
                          ? <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-50 text-slate-500 border border-slate-200 shrink-0">常用</span>
                          : <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-600 border border-amber-100 shrink-0">需验证</span>}
                      </div>
                      <div className="mt-1 text-[12px] text-slate-400">
                        {p.real_name ? (maskName(p.real_name) + ' · ') : ''}{p.bank} · 尾号 {p.account_tail}
                      </div>
                      <div className={'mt-1 text-[11px] '
                        + (p.linked_user_id ? 'text-emerald-600' : 'text-slate-400')}>
                        {p.linked_user_id ? '微众银行 · 实时到账' : (p.bank + ' · 跨行清算')}
                      </div>
                    </button>
                  );
                })}
              </div>
            )}

          {/* ---- 尾号核对（防转错人）：仅提醒，不阻断提交 ---- */}
          {payee && (
            <div className="mt-4 p-4 rounded-xl bg-slate-50/70 border border-slate-100">
              <span className="block text-[11px] text-slate-400 mb-2">
                请核对 {payee.nickname} 的卡号后四位（{payee.bank}），输入完成后点其他地方即自动核对
              </span>
              <input
                value={tailInput}
                onChange={e => setTailInput(String(e.target.value || '').replace(/\D/g, '').slice(0, 6))}
                onBlur={runTailCheck}
                inputMode="numeric" maxLength={6}
                className={inputCls + ' font-mono'}
                placeholder="如：4321" />

              {tailChecking ? (
                <div className="mt-2.5 text-[11.5px] text-slate-400">正在核对尾号…</div>
              ) : null}

              {!tailChecking && tailCheck && tailCheck.found === 'ambiguous' ? (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2">
                  <span className="text-[12px] font-semibold text-amber-700 leading-5">!</span>
                  <span className="text-[11.5px] text-amber-700 leading-5">
                    {tailCheck.message}
                    {'（' + (tailCheck.candidates || []).map(c => c.bank + ' 尾号 ' + c.account_tail).join(' / ') + '）'}
                  </span>
                </div>
              ) : null}

              {!tailChecking && tailCheck && tailCheck.found === true && tailCheck.match === false ? (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2">
                  <span className="text-[12px] font-semibold text-amber-700 leading-5">!</span>
                  <span className="text-[11.5px] text-amber-700 leading-5">
                    {tailCheck.message || '尾号不符，请核对后再提交'}
                  </span>
                </div>
              ) : null}

              {!tailChecking && tailCheck && tailCheck.found === true && tailCheck.match === true && tailCheck.is_insite ? (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2">
                  <span className="text-[12px] font-semibold text-emerald-700 leading-5">✓</span>
                  <span className="text-[11.5px] text-emerald-700 leading-5">
                    站内用户，实时到账（尾号 {tailCheck.account_tail} 已核对）
                  </span>
                </div>
              ) : null}

              {!tailChecking && tailCheck && tailCheck.found === true && tailCheck.match === true && !tailCheck.is_insite ? (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-slate-200 bg-panel px-3 py-2">
                  <span className="text-[12px] font-semibold text-slate-500 leading-5">✓</span>
                  <span className="text-[11.5px] text-slate-500 leading-5">
                    尾号已核对（{tailCheck.account_tail}），行外收款人，资金经在途清算，
                    预计 5 分钟内到账（演示加速）；账户异常将全额退回
                  </span>
                </div>
              ) : null}

              {!tailChecking && tailCheck && tailCheck.found === false ? (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2">
                  <span className="text-[12px] font-semibold text-amber-700 leading-5">!</span>
                  <span className="text-[11.5px] text-amber-700 leading-5">{tailCheck.message}</span>
                </div>
              ) : null}
            </div>
          )}

          <div className="mt-5 flex items-center gap-3">
            <button disabled={!payee} onClick={() => setStep(2)} className={btnPrimary}>
              下一步
            </button>
            <button onClick={() => navigate('/chat')} className={btnGhost}>返回对话</button>
            {payee && (
              <span className="text-[11px] text-slate-400 ml-auto">
                已选：{payee.nickname}（{payee.bank} 尾号 {payee.account_tail}）
              </span>
            )}
          </div>
        </Panel>
      )}

      {/* ---------------- 步骤 2：金额 ---------------- */}
      {step === 2 && (
        <Panel title="转账金额" icon="banknote"
               right={<span className="text-[11px] text-slate-400">收款人：{payee ? payee.nickname : '—'}</span>}>
          <div className="space-y-5">
            {/* 付款账户 */}
            <div>
              <span className="block text-[11px] text-slate-400 mb-2">付款账户</span>
              <div className="grid grid-cols-2 gap-2.5">
                {accounts.map(a => {
                  const on = payAcc && a.id === payAcc.id;
                  return (
                    <button key={a.id} onClick={() => setFromId(a.id)}
                      className={`text-left px-4 py-3 rounded-xl border transition-all
                        ${on ? 'border-brand-300 bg-brand-50/60' : 'border-slate-200 hover:bg-slate-50'}`}>
                      <div className="text-[13px] font-medium text-slate-700 truncate">{a.name}</div>
                      {balShown ? (
                        <div className="mt-1 text-[15px] font-mono font-semibold text-gold-600 amount-fade">
                          ¥{fmtMoney(a.balance)}
                        </div>
                      ) : (
                        <button onClick={() => setBalShown(true)}
                          className="mt-1 text-[15px] font-mono font-semibold text-gold-600/70">
                          {MASK_TEXT}
                          <span className="ml-2 text-[11px] text-slate-400 font-sans">显示</span>
                        </button>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 金额输入：金色等宽大数字 */}
            <div>
              <span className="block text-[11px] text-slate-400 mb-2">转账金额</span>
              <div className={`flex items-baseline gap-2 px-4 py-3 rounded-xl border transition-all
                ${overBalance ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200 focus-within:border-brand-400 focus-within:ring-2 focus-within:ring-brand-100'}`}>
                <span className="text-[22px] font-mono font-semibold text-gold-600 shrink-0">¥</span>
                <input value={amount} inputMode="decimal" placeholder="0.00"
                       onChange={e => {
                         /* 只留数字与一个小数点，最多两位小数 */
                         let v = e.target.value.replace(/[^\d.]/g, '');
                         const i = v.indexOf('.');
                         if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '').slice(0, 2);
                         setAmount(v);
                       }}
                       className="flex-1 min-w-0 bg-transparent outline-none text-[30px] leading-none font-mono
                                  font-semibold text-gold-600 tracking-tight placeholder:text-slate-400" />
              </div>
              <div className="mt-2 flex items-center gap-2">
                {[500, 1000, 2000, 5000].map(v => (
                  <button key={v} onClick={() => setAmount(String(v))}
                    className="px-2.5 py-1 rounded-lg text-[11px] font-medium text-slate-500 bg-slate-50
                               border border-slate-200 hover:bg-slate-100 transition-colors font-mono">
                    {fmtMoney(v)}
                  </button>
                ))}
                <span className="ml-auto text-[11px] text-slate-400">
                  可用余额{' '}
                  {balShown
                    ? <b className="font-mono text-slate-500">{avail == null ? '—' : '¥' + fmtMoney(avail)}</b>
                    : <button onClick={() => setBalShown(true)}
                        className="font-mono text-slate-400 hover:text-brand-600 transition-colors">
                        {MASK_TEXT}<span className="ml-1 font-sans">显示</span>
                      </button>}
                </span>
              </div>
              {overBalance && (
                <div className="mt-2 text-[12px] text-rose-500 flex items-center gap-1.5">
                  超出可用余额 ¥{fmtMoney(amtNum - avail)}，请调整金额或更换付款账户
                </div>
              )}
            </div>

            {/* 备注 */}
            <label className="block">
              <span className="block text-[11px] text-slate-400 mb-2">备注（选填，最多 40 字）</span>
              <input value={remark} onChange={e => setRemark(e.target.value)} maxLength={40}
                     className={inputCls} placeholder="如：9 月生活费" />
            </label>

            {willVerify && canNext2 && (
              <div className="flex items-center gap-1.5 text-[11px] text-amber-600">
                {payee && !payee.is_frequent ? '收款人为非常用，' : '金额超过阈值，'}
                提交后需完成安全验证（验证码 / 支付密码按风险分级组合）
              </div>
            )}
          </div>

          <div className="mt-5 flex items-center gap-3">
            <button disabled={!canNext2} onClick={() => setStep(3)} className={btnPrimary}>
              下一步
            </button>
            <button onClick={() => setStep(1)} className={btnGhost}>上一步</button>
          </div>
        </Panel>
      )}

      {/* ---------------- 步骤 3：核对 ---------------- */}
      {step === 3 && (
        <Panel title="核对转账信息" icon="file-text">
          <div className="space-y-3">
            {[['收款人', payee ? `${payee.nickname}（${payee.bank} 尾号 ${payee.account_tail}）` : '—'],
              ['付款账户', payAcc ? payAcc.name : '主账户'],
              ['备注', remark.trim() || '（无）']].map(([k, v]) => (
              <div key={k} className="flex items-baseline gap-4">
                <span className="w-[72px] shrink-0 text-[13px] text-slate-400">{k}</span>
                <span className="text-[15px] text-slate-800 font-medium">{v}</span>
              </div>
            ))}
            <div className="flex items-baseline gap-4">
              <span className="w-[72px] shrink-0 text-[13px] text-slate-400">金额</span>
              <span className="text-[26px] leading-none font-semibold text-gold-600 font-mono tracking-tight">
                ¥{fmtMoney(amtNum)}
              </span>
            </div>
          </div>

          <div className="mt-5 p-3.5 rounded-xl bg-amber-50/60 border border-amber-100 flex items-start gap-2">
            <span className="text-[12px] text-amber-700 leading-relaxed">
              点击「提交」不会立即扣款。小微会先做风险检查{willVerify ? '、下发安全验证（验证码/支付密码）' : ''}，
              并在最后一步请你再确认一次，确认后才真正提交银行执行。
            </span>
          </div>

          <div className="mt-5 flex items-center gap-3">
            <button onClick={submit} disabled={busy} className={btnPrimary}>
              提交，进入安全流程
            </button>
            <button onClick={() => setStep(2)} className={btnGhost}>上一步</button>
          </div>
        </Panel>
      )}

      {/* ---------------- 步骤 4：安全执行 ---------------- */}
      {step === 4 && (
        <div className="space-y-4">
          <Panel title="安全流程" icon="shield-check"
                 right={
                   <span className="text-[11px] text-slate-400">
                     {stage === 'done' ? '已完成' : stage === 'error' ? '已终止' : '进行中…'}
                   </span>
                 }>
            {nodes.length === 0 && stage === 'running' && <Loading text="正在提交到安全工作流…" />}
            <NodeTimeline nodes={nodes} />
          </Panel>

          {/* 安全验证（C3/B4）：按 factor 渲染验证码（收件箱取码）/ 支付密码卡 */}
          {stage === 'verify' && (
            <Panel title="安全验证" icon="shield-check">
              <VerifyPanel info={verifyInfo} busy={busy}
                onCodeSubmit={(c) => resume(c)}
                onPasswordPassed={(needSet) => resume(needSet ? PWD_SET_PLACEHOLDER : PWD_RESUME_PLACEHOLDER)}
                onOpenInbox={() => { window.dispatchEvent(new CustomEvent('xb:open-inbox')); }}
                onCancel={() => resume('取消')} />
            </Panel>
          )}

          {/* 最终确认：复用对话内同款琥珀确认卡 */}
          {stage === 'confirm' && confirmCard && (
            <div className="flex justify-center py-1">
              <ConfirmCard stage="pending"
                           fields={confirmCard.fields}
                           amount={confirmCard.amount}
                           onConfirm={() => resume('确认')}
                           onCancel={() => resume('取消')} />
            </div>
          )}

          {/* 成功 */}
          {stage === 'done' && (
            <Panel title="转账完成" icon="check-circle">
              <div className="flex items-center gap-4">
                <span className="w-12 h-12 rounded-full flex items-center justify-center bg-emerald-50 shrink-0
                                 text-emerald-500 text-[24px] font-semibold leading-none">✓</span>
                <div className="min-w-0">
                  <div className="text-[15px] font-semibold text-emerald-700">
                    已向 {payee ? payee.nickname : '收款人'} 转账
                  </div>
                  <div className="mt-1 text-[26px] leading-none font-mono font-semibold text-gold-600 tracking-tight">
                    ¥{fmtMoney(receipt ? receipt.amount : amtNum)}
                  </div>
                  {receipt && receipt.serial_no && (
                    <div className="mt-2 text-[12px] text-slate-400">
                      流水号 <span className="font-mono text-slate-500">{receipt.serial_no}</span>
                    </div>
                  )}
                </div>
                <div className="ml-auto text-right shrink-0">
                  <div className="text-[11px] text-slate-400">付款账户余额</div>
                  <div className="mt-1 text-[16px] font-mono font-semibold text-slate-700">
                    ¥{avail == null ? '—' : fmtMoney(avail)}
                  </div>
                </div>
              </div>
              <div className="mt-5 flex items-center gap-3">
                <button onClick={goChatAfterTask} className={btnPrimary}>
                  在对话中查看
                </button>
                <button onClick={resetAll} className={btnGhost}>再转一笔</button>
                <button onClick={() => navigate('/bills')} className={btnGhost}>查看账单</button>
              </div>
            </Panel>
          )}

          {/* 失败 / 被拦截 / 取消 */}
          {stage === 'error' && (
            <Panel title="本次转账未完成" icon="alert-triangle">
              <div className="flex items-start gap-3">
                <span className="w-10 h-10 rounded-full flex items-center justify-center bg-rose-50 shrink-0
                                 text-rose-500 text-[20px] font-semibold leading-none">!</span>
                <div className="min-w-0">
                  <div className="text-[14px] font-medium text-slate-700 leading-relaxed">{errText || '流程已终止'}</div>
                  <div className="mt-1.5 text-[12px] text-slate-400">资金未发生变动。你可以调整信息后重新发起。</div>
                </div>
              </div>
              <div className="mt-5 flex items-center gap-3">
                <button onClick={resetAll} className={btnPrimary}>重新发起</button>
                <button onClick={goChatAfterTask} className={btnGhost}>回到对话</button>
              </div>
            </Panel>
          )}
        </div>
      )}
    </PageShell>
  );
}

/* ============================================================
   C7 用户菜单 / 资料弹窗 / 实名弹窗（个人信息的唯一入口体系）
   —— 脱敏铁律：姓名 姓+**（张**）；手机仅尾号 / 脱敏格式；
      完整姓名仅本人点「显示完整姓名」主动展开。
   ============================================================ */
/* 状态徽标：小圆点文字底（C7 弹窗用；admin.html 同名组件独立存在） */
function Badge({ tone = 'gold', children }) {
  return (
    <span className={'inline-flex items-center px-1.5 py-0.5 rounded text-[10px] border ' +
      (tone === 'danger' ? 'text-rose-300 bg-rose-400/10 border-rose-400/40'
        : tone === 'ok' ? 'text-emerald-300 bg-emerald-400/10 border-emerald-400/30'
        : 'text-gold-300 bg-gold-500/10 border-gold-500/40')}>{children}</span>
  );
}

function maskNameCN(n) {
  const s = String(n || '').trim();
  if (!s) return '';
  return s.length <= 1 ? s + '**' : s[0] + '**';
}

/* 通用弹窗外壳：720px 深色玻璃；ESC / 遮罩点击关闭 */
function C7Modal({ title, onClose, children, footer }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-[85] flex items-center justify-center px-4"
         style={{ background: 'rgba(4,7,12,0.55)', backdropFilter: 'blur(3px)' }} onClick={onClose}>
      <div className="w-[720px] max-w-full max-h-[86vh] flex flex-col rounded-2xl border slide-up"
           style={{ background: 'rgba(13,19,29,0.94)', backdropFilter: 'blur(20px)',
                    borderColor: 'rgba(212,160,23,0.25)',
                    boxShadow: '0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05)' }}
           onClick={e => e.stopPropagation()}>
        <div className="shrink-0 flex items-center justify-between px-6 py-4 border-b border-white/10">
          <span className="text-[16px] font-semibold text-[#F0D590]">{title}</span>
          <button onClick={onClose} className="text-[12px] text-white/45 hover:text-white transition-colors">关闭</button>
        </div>
        <div className="flex-1 min-h-0 overflow-y-auto scroll-thin">{children}</div>
        {footer && <div className="shrink-0 px-6 py-4 border-t border-white/10">{footer}</div>}
      </div>
    </div>
  );
}
